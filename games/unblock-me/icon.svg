<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed: iOS applies its own mask, so no rounded corners here. -->
  <rect width="100" height="100" fill="#2a1a0e"/>
  <!-- Well -->
  <rect x="18" y="18" width="64" height="64" fill="#4e3219"/>
  <!-- Oak frame, as four bars. The right bar is split, leaving the exit gap. -->
  <rect x="8" y="8" width="84" height="10" fill="#c89a5e"/>
  <rect x="8" y="82" width="84" height="10" fill="#c89a5e"/>
  <rect x="8" y="8" width="10" height="84" fill="#c89a5e"/>
  <rect x="82" y="8" width="10" height="30" fill="#c89a5e"/>
  <rect x="82" y="58" width="10" height="34" fill="#c89a5e"/>
  <!-- Plain blocks, clear of the exit row -->
  <rect x="22" y="22" width="32" height="14" rx="4" fill="#dcb075"/>
  <rect x="62" y="58" width="14" height="22" rx="4" fill="#d2a266"/>
  <!-- Target block, lined up with the gap and with a clear run at it -->
  <rect x="22" y="41" width="36" height="14" rx="4" fill="#e8664a"/>
  <!-- Exit chevron -->
  <path d="M84,41 L92,48 L84,55" fill="none" stroke="#ffc25c" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
