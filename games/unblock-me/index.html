<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16110c">
<link rel="manifest" href="/games/unblock-me/manifest.json">
<link rel="icon" href="/games/unblock-me/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/games/unblock-me/apple-touch-icon.png">
<title>Unblock Me</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  overflow: hidden;
  height: 100%;
  touch-action: none;
}

body {
  height: 100%;
  background: radial-gradient(ellipse at 50% 38%, #241a11 0%, #16110c 62%, #0d0a07 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 12px calc(env(safe-area-inset-bottom) + 14px);
  padding-top: calc(env(safe-area-inset-top) + 12px);
  color: #c9b393;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.back-link {
  align-self: flex-start;
  color: #8a7a63;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  transition: color 0.15s;
  flex: 0 0 auto;
}
.back-link:hover { color: #4af; }

h1 {
  font-size: clamp(1.4rem, 5.6vw, 2.3rem);
  font-weight: 800;
  color: #ffb454;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  flex: 0 0 auto;
  margin-top: 2px;
}

.tagline {
  font-size: 0.72rem;
  color: #a08767;
  text-align: center;
  letter-spacing: 0.03em;
  margin: 2px 0 8px;
  flex: 0 0 auto;
}

.info-bar {
  display: flex;
  gap: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  color: #c9b393;
  flex-wrap: wrap;
  justify-content: center;
  flex: 0 0 auto;
  margin-bottom: 8px;
}

.pill {
  background: rgba(255,200,130,0.07);
  border: 1px solid #5a4632;
  padding: 4px 13px;
  border-radius: 20px;
  letter-spacing: 0.03em;
  white-space: nowrap;
}
.pill.star { color: #ffc25c; }

/* The canvas is taken out of flow so #stage's measured box is the space the
   board may use, independent of whatever size the renderer last picked for it.
   Measuring beats the magic "innerHeight - 290" constant the older games use. */
#stage {
  position: relative;
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  align-self: stretch;
}
#stage::before {
  content: '';
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 55%, rgba(255,175,90,0.13), rgba(0,0,0,0) 70%);
  pointer-events: none;
}
#scene {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: block;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

#loadErr {
  display: none;
  max-width: 22rem;
  margin: auto;
  text-align: center;
  font-size: 0.9rem;
  line-height: 1.5;
  color: #d88;
}
#loadErr.on { display: block; }

.btns {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
  justify-content: center;
  flex: 0 0 auto;
}

.btn {
  padding: 10px 16px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid #5a4632;
  border-radius: 50px;
  cursor: pointer;
  background: rgba(255,200,130,0.08);
  color: #d8c3a2;
  transition: transform 0.12s, opacity 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
  /* Touch target floor for iPad/iPhone. */
  min-height: 44px;
  min-width: 56px;
}
.btn:active { transform: scale(0.94); }
.btn:hover { color: #fff1dc; border-color: #8a6b45; }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.btn-primary {
  background: linear-gradient(135deg, #f0a03c 0%, #d2701a 100%);
  border-color: transparent;
  color: #241503;
  box-shadow: 0 2px 12px rgba(240,160,60,0.28);
}
.btn-wide { padding: 12px 34px; font-size: 0.92rem; }

.toast {
  position: fixed;
  bottom: 16%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(60,40,20,0.94);
  border: 1px solid #8a6b45;
  color: #ffd9a0;
  padding: 9px 22px;
  border-radius: 30px;
  font-size: 0.86rem;
  font-weight: 700;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  background: rgba(14,10,6,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.overlay.on { display: flex; }

.win-stars {
  font-size: clamp(2rem, 10vw, 3.4rem);
  letter-spacing: 0.1em;
  line-height: 1;
  color: #ffc25c;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.win-stars .off { color: #4a3a28; }
.win-title {
  font-size: clamp(1.6rem, 6.5vw, 2.6rem);
  font-weight: 800;
  color: #ffb454;
  letter-spacing: 0.06em;
  animation: pop 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
}
.win-sub {
  font-size: 0.95rem;
  color: #bda586;
  text-align: center;
  animation: pop 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
}
.win-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
  animation: pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* --- Level select --- */
.panel-title {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #ffb454;
}
.pack-name { font-size: 0.78rem; color: #a08767; margin-bottom: 4px; }
.level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(74px, 84px));
  gap: 10px;
  justify-content: center;
  max-width: 420px;
  width: 100%;
}
.level-tile {
  aspect-ratio: 1;
  border-radius: 14px;
  border: 1px solid #5a4632;
  background: rgba(255,200,130,0.07);
  color: #d8c3a2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-weight: 800;
  font-size: 1.2rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s;
}
.level-tile:active { transform: scale(0.94); }
.level-tile .sub { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.04em; color: #ffc25c; }
.level-tile.locked { color: #6a5943; border-color: #3a2e21; cursor: default; }
.level-tile.locked .sub { color: #6a5943; }
.level-tile.solved { border-color: #8a6b45; background: rgba(255,190,100,0.13); }
.level-tile.par { border-color: #ffc25c; }

.confetti-p {
  position: fixed;
  top: -20px;
  pointer-events: none;
  z-index: 200;
  animation: cfall linear forwards;
}
@keyframes cfall {
  to { transform: translateY(110vh) rotate(var(--spin)); opacity: 0; }
}

@media (max-height: 560px) {
  h1 { font-size: 1.15rem; }
  .tagline { display: none; }
}

/* The 3D side reads this same query in JS (see REDUCED). Here it only has to
   cover the DOM: the result panel's scale-from-0.4 pops, and the transitions.
   Nothing is hidden — the panel still appears, it just doesn't spring. */
@media (prefers-reduced-motion: reduce) {
  .win-stars, .win-title, .win-sub, .win-btns { animation: none; }
  .btn, .level-tile, .toast, .back-link { transition: none; }
  .btn:active, .level-tile:active { transform: none; }
}

/* Six buttons wrap to a second row on a phone, which costs more height than the
   "Undo" word is worth. Drop the label and tighten the pills instead — the 44px
   touch-target floor is kept. */
@media (max-width: 430px) {
  .btns { gap: 5px; }
  .btn { padding: 10px 11px; min-width: 44px; }
  #btnUndo .lbl { display: none; }
}
</style>
</head>
<body>

<a href="/" class="back-link">&larr; All Games</a>
<h1>Unblock Me</h1>
<p class="tagline">Slide the blocks aside, then drive the red one out.</p>

<div class="info-bar">
  <span class="pill" id="lvlPill">Level 1</span>
  <span class="pill" id="movePill">Moves: 0</span>
  <span class="pill star" id="parPill">Par 4</span>
</div>

<div id="stage">
  <canvas id="scene"></canvas>
</div>

<p id="loadErr">Couldn&rsquo;t load the 3D engine. Reload the page &mdash; if you&rsquo;re offline, open the game once while connected so it can be cached.</p>

<div class="btns">
  <button class="btn" id="btnLevels" title="Level select">&#9783;</button>
  <button class="btn" id="btnRestart" title="Restart level">&#8635;</button>
  <button class="btn" id="btnUndo" title="Undo one move">&#8630;<span class="lbl"> Undo</span></button>
  <button class="btn" id="btnHint" title="Show the next move on the optimal path">&#128161; <span id="hintCount">5</span></button>
  <button class="btn" id="btnSound" title="Sound effects">&#128266;</button>
  <button class="btn" id="btnMusic" title="Music">&#127925;</button>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="winOverlay">
  <div class="win-stars" id="winStars"></div>
  <div class="win-title">Unblocked!</div>
  <div class="win-sub" id="winSub"></div>
  <div class="win-btns">
    <button class="btn" id="btnReplay">Replay</button>
    <button class="btn" id="btnWinLevels">Levels</button>
    <button class="btn btn-primary btn-wide" id="btnNext">Next &#8594;</button>
  </div>
</div>

<div class="overlay" id="levelOverlay">
  <div class="panel-title">Select a level</div>
  <div class="pack-name" id="packName">Oak &mdash; 5 puzzles</div>
  <div class="level-grid" id="levelGrid"></div>
  <div class="win-btns">
    <button class="btn" id="btnCloseLevels">Close</button>
  </div>
</div>

<script type="module">
import * as THREE from '/vendor/three.module.min.js';

// ── Juice Toolkit (copy-pasted subset, see /templates/juice.js) ───────────────

function juiceBurst(x, y, colors, opts) {
  opts = opts || {};
  var count = opts.count || 14;
  var spread = opts.spread || 70;
  var duration = opts.duration || 500;
  for (var i = 0; i < count; i++) {
    var el = document.createElement('div');
    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    var dist = spread * (0.5 + Math.random() * 0.5);
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist;
    var size = 4 + Math.random() * 4;
    el.style.cssText =
      'position:fixed;left:' + x + 'px;top:' + y + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
      'background:' + colors[i % colors.length] + ';' +
      'pointer-events:none;z-index:999;';
    document.body.appendChild(el);
    (function(particle, tx, ty) {
      particle.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(0.3)', opacity: 0 }
      ], { duration: duration, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = function() {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      };
    }(el, dx, dy));
  }
}

// ── Puzzle model ─────────────────────────────────────────────────────────────
// PURE DATA AND LOGIC. No DOM, no three.js, no `window`.
//
// tools/verify-levels.mjs slices this exact region out of this file (between
// this banner and the matching "/Puzzle model" one) and runs it in node, so the
// shipped solver and the audited solver cannot drift apart. Keep it
// dependency-free and keep both banner lines intact.

// Grid art, one character per cell: '.' empty, 'X' the target block, any other
// letter a plain block. Orientation and length are read off the art, so adding
// a level is drawing one. Adding a pack is pushing to PACKS.
//
// A *move* is one slide of any distance, per the classic rules, so `par` counts
// slides, not cells. It is not a number to guess: auditLevels() checks every
// `par` against the solver at boot, and `make verify` checks them in CI-able
// form. A level whose par is wrong, or which cannot be solved at all, fails
// loudly instead of shipping (warehouse-keeper shipped an unsolvable level 8
// for want of exactly this).
const LEVELS = [
  {
    id: 1, pack: 'oak', name: 'First Slide', par: 4,
    rows: [
      '...A..',
      '...A..',
      'XX.A..',
      'BB..C.',
      'DDEEC.',
      '......',
    ],
  },
  {
    id: 2, pack: 'oak', name: 'Shuffle', par: 7,
    rows: [
      '...A..',
      '...A..',
      'XX.A..',
      '.BCDDD',
      '.BC..E',
      '..FF.E',
    ],
  },
  {
    id: 3, pack: 'oak', name: 'Crowded Yard', par: 12,
    rows: [
      'AA..B.',
      '..CDB.',
      'XXCDB.',
      '..EDFF',
      'G.E...',
      'GHHH..',
    ],
  },
  {
    id: 4, pack: 'oak', name: 'Deadlock', par: 18,
    rows: [
      '.AA.B.',
      '..CDB.',
      'XXCD.E',
      '.FC..E',
      'GFHHI.',
      'GJJJI.',
    ],
  },
  {
    id: 5, pack: 'oak', name: 'The Long Way Round', par: 25,
    rows: [
      'A.BC..',
      'A.BCDD',
      '.XXE.F',
      '...EGF',
      '.HHHGI',
      '...JJI',
    ],
  },
];

const PACKS = [
  { id: 'oak', name: 'Oak' },
];

// One cell tall, in the right wall, on row 2. A level's own `exit` overrides
// it and `rows` sets the grid size, so nothing below is hard-coded to 6x6.
const DEFAULT_EXIT = { row: 2, side: 'right' };

function parseLevel(lv) {
  const rows = lv.rows;
  const h = rows.length;
  const w = rows[0].length;
  const errs = [];
  const exit = Object.assign({}, DEFAULT_EXIT, lv.exit || {});

  for (let r = 0; r < h; r++) {
    if (rows[r].length !== w) errs.push('row ' + r + ' is ' + rows[r].length + ' wide, expected ' + w);
    if (!/^[A-Z.]+$/.test(rows[r])) errs.push('row ' + r + ' has characters outside [A-Z.]');
  }
  if (errs.length) return { errs };

  // Collect each letter's cells, then insist the shape is a straight 1xN run.
  const cells = new Map();
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const ch = rows[r][c];
      if (ch === '.') continue;
      if (!cells.has(ch)) cells.set(ch, []);
      cells.get(ch).push({ r, c });
    }
  }

  const blocks = [];
  for (const [ch, cs] of cells) {
    const rs = cs.map((p) => p.r), cols = cs.map((p) => p.c);
    const r0 = Math.min.apply(null, rs), r1 = Math.max.apply(null, rs);
    const c0 = Math.min.apply(null, cols), c1 = Math.max.apply(null, cols);
    const spanR = r1 - r0 + 1, spanC = c1 - c0 + 1;
    if (spanR * spanC !== cs.length || (spanR !== 1 && spanC !== 1)) {
      errs.push('block ' + ch + ' is not a straight run');
      continue;
    }
    const len = Math.max(spanR, spanC);
    if (len < 2 || len > 3) {
      errs.push('block ' + ch + ' has length ' + len + ', expected 2 or 3');
      continue;
    }
    blocks.push({ ch, orient: spanC > 1 ? 'h' : 'v', len, row: r0, col: c0, isTarget: ch === 'X' });
  }

  // Stable order, so a state vector means the same thing every time it is built.
  blocks.sort((a, b) => (a.ch < b.ch ? -1 : 1));
  const ti = blocks.findIndex((b) => b.isTarget);

  if (ti === -1) errs.push('no target block (X)');
  else {
    const t = blocks[ti];
    if (t.orient !== 'h') errs.push('target block must be horizontal');
    if (t.row !== exit.row) errs.push('target is on row ' + t.row + ', exit is on row ' + exit.row);
  }
  if (errs.length) return { errs };

  return { id: lv.id, pack: lv.pack, name: lv.name, par: lv.par, w, h, exit, blocks, ti, errs };
}

// A state is one integer per block: its position along its own axis (col for a
// horizontal block, row for a vertical one). Everything else is fixed by the
// level, so this vector is the whole mutable world — which is what makes the
// BFS below cheap enough to run at boot.
function startState(lv) {
  return lv.blocks.map((b) => (b.orient === 'h' ? b.col : b.row));
}

function occupancy(lv, st) {
  const grid = new Int8Array(lv.w * lv.h).fill(-1);
  for (let i = 0; i < lv.blocks.length; i++) {
    const b = lv.blocks[i], p = st[i];
    for (let k = 0; k < b.len; k++) {
      const r = b.orient === 'h' ? b.row : p + k;
      const c = b.orient === 'h' ? p + k : b.col;
      grid[r * lv.w + c] = i;
    }
  }
  return grid;
}

// Inclusive range of positions block `i` can slide to, ignoring the exit gap.
// Shared by the solver and by the drag clamp, so what the finger can do and
// what the solver believes can never disagree.
function freeRange(lv, grid, st, i) {
  const b = lv.blocks[i], p = st[i];
  const limit = b.orient === 'h' ? lv.w : lv.h;
  let lo = p, hi = p;
  for (;;) {
    const n = lo - 1;
    if (n < 0) break;
    const r = b.orient === 'h' ? b.row : n;
    const c = b.orient === 'h' ? n : b.col;
    if (grid[r * lv.w + c] !== -1) break;
    lo = n;
  }
  for (;;) {
    const n = hi + 1;
    if (n + b.len - 1 >= limit) break;
    const r = b.orient === 'h' ? b.row : n + b.len - 1;
    const c = b.orient === 'h' ? n + b.len - 1 : b.col;
    if (grid[r * lv.w + c] !== -1) break;
    hi = n;
  }
  return { lo, hi };
}

// Solved when the corridor from the target's leading edge to the exit wall is
// clear: the slide that crosses it is the same move that carries the block out,
// so it is counted once, as the final move of the path. Only cells on the exit
// side count — a block parked behind the target is irrelevant.
function canExit(lv, st, grid) {
  const t = lv.blocks[lv.ti];
  const p = st[lv.ti];
  if (lv.exit.side === 'left') {
    for (let c = p - 1; c >= 0; c--) if (grid[t.row * lv.w + c] !== -1) return false;
  } else {
    for (let c = p + t.len; c < lv.w; c++) if (grid[t.row * lv.w + c] !== -1) return false;
  }
  return true;
}

// Every legal slide from `st`, as { i, to }. Distance is free, so one entry per
// reachable landing position rather than one per direction.
function legalMoves(lv, st) {
  const grid = occupancy(lv, st);
  const out = [];
  for (let i = 0; i < lv.blocks.length; i++) {
    const rg = freeRange(lv, grid, st, i);
    for (let p = rg.lo; p <= rg.hi; p++) if (p !== st[i]) out.push({ i: i, to: p });
  }
  return out;
}

const EXIT = 'exit';

// BFS over slide-states. Returns the optimal move list, the last entry being
// { i: target, to: EXIT } — the slide out through the gap. null if unsolvable,
// or if it ran past `cap` expanded states.
function solve(lv, st0, cap) {
  cap = cap || 400000;
  const start = st0 || startState(lv);
  const seen = new Map();
  const queue = [start];
  // Index-pointer queue, not Array.shift(): shift() is O(n) and turned a
  // 300k-state search into something that looked like a hang rather than a proof.
  seen.set(start.join(','), null);
  let head = 0, n = 0;

  while (head < queue.length) {
    const st = queue[head++];
    const key = st.join(',');
    if (canExit(lv, st, occupancy(lv, st))) {
      const path = [];
      let k = key;
      for (;;) {
        const e = seen.get(k);
        if (!e) break;
        path.push(e.move);
        k = e.prev;
      }
      path.reverse();
      path.push({ i: lv.ti, to: EXIT });
      return path;
    }
    if (++n > cap) return null;
    const mvs = legalMoves(lv, st);
    for (let m = 0; m < mvs.length; m++) {
      const mv = mvs[m];
      const next = st.slice();
      next[mv.i] = mv.to;
      const nk = next.join(',');
      if (seen.has(nk)) continue;
      seen.set(nk, { prev: key, move: mv });
      queue.push(next);
    }
  }
  return null;
}

// Returns one entry per broken level, [] when every level parses, is solvable
// and matches its authored par. Silent success is the point: it runs at boot
// and only speaks up when a level is wrong.
function auditLevels(levels) {
  const out = [];
  for (const raw of levels) {
    const lv = parseLevel(raw);
    if (lv.errs && lv.errs.length) {
      out.push({ id: raw.id, name: raw.name, min: null, errs: lv.errs.slice() });
      continue;
    }
    const errs = [];
    const sol = solve(lv);
    if (!sol) errs.push('unsolvable');
    else {
      if (lv.par !== sol.length) errs.push('par is ' + lv.par + ', solver says ' + sol.length);
      // A target with a clear run to the exit on move one is not a puzzle.
      if (sol.length < 2) errs.push('trivial: target starts unblocked');
    }
    if (errs.length) out.push({ id: raw.id, name: raw.name, min: sol ? sol.length : null, errs });
  }
  return out;
}

// Difficulty is a function of the solver's output, not the block count.
function tierOf(par) {
  if (par <= 8) return 'Beginner';
  if (par <= 16) return 'Intermediate';
  if (par <= 28) return 'Advanced';
  return 'Expert';
}

function starsFor(par, moves) {
  if (moves <= par) return 3;
  if (moves <= par + Math.max(2, Math.ceil(par * 0.5))) return 2;
  return 1;
}
// ── /Puzzle model ────────────────────────────────────────────────────────────

// Exposed so the level data can be re-checked from a console on a device,
// without a build step. `make verify` runs the same function in node.
window.__unblockAudit = () => auditLevels(LEVELS);

// A full BFS of every level costs ~50ms on a laptop and several times that on a
// phone. It is a safety net for whoever edits LEVELS, not gameplay, so it runs
// once the board is on screen rather than spending that budget before the first
// pixel. See the call at the bottom of the Init section.
function runAudit() {
  for (const a of auditLevels(LEVELS)) {
    console.error('[unblock-me] level ' + a.id + ' (' + a.name + '): ' + a.errs.join('; '));
  }
}

// ── Save data ────────────────────────────────────────────────────────────────

const SAVE_KEY = 'unblock-me/v1';
const save = loadSave();

function loadSave() {
  const def = { unlocked: 1, best: {}, hints: 5, sfx: true, music: true };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return def;
    return Object.assign(def, JSON.parse(raw));
  } catch (e) { return def; }
}

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

// ── Audio ────────────────────────────────────────────────────────────────────
// Everything is synthesised: no audio files to cache, nothing extra in sw.js.

let actx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;

function audio() {
  if (actx) return actx;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return null; }
  master = actx.createGain(); master.gain.value = 0.85; master.connect(actx.destination);
  sfxBus = actx.createGain(); sfxBus.gain.value = save.sfx ? 1 : 0; sfxBus.connect(master);
  musicBus = actx.createGain(); musicBus.gain.value = 0; musicBus.connect(master);

  const n = actx.sampleRate * 1.5;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return actx;
}

// iOS starts every context suspended and only lets a user gesture resume it.
function resumeAudio() {
  const ctx = audio();
  if (ctx && ctx.state === 'suspended') ctx.resume();
  if (save.music) startMusic();
}

function noiseSource(ctx) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf;
  return s;
}

// Wood on wood: filtered noise, not a tone. The slide is a loop whose gain and
// filter track the block's speed, so it starts and stops with the motion rather
// than firing as a fixed-length one-shot.
let slideSrc = null, slideGain = null, slideFilter = null;

function slideOn() {
  const ctx = audio();
  if (!ctx || slideSrc) return;
  slideSrc = noiseSource(ctx);
  slideSrc.loop = true;
  slideFilter = ctx.createBiquadFilter();
  slideFilter.type = 'bandpass';
  slideFilter.frequency.value = 800;
  slideFilter.Q.value = 1.1;
  slideGain = ctx.createGain();
  slideGain.gain.value = 0;
  slideSrc.connect(slideFilter).connect(slideGain).connect(sfxBus);
  slideSrc.start();
}

function slideSpeed(v) {
  if (!slideGain) return;
  const ctx = actx;
  const amt = Math.min(0.16, v * 0.14);
  slideGain.gain.setTargetAtTime(amt, ctx.currentTime, 0.03);
  slideFilter.frequency.setTargetAtTime(520 + Math.min(1400, v * 120), ctx.currentTime, 0.05);
}

function slideOff() {
  if (!slideSrc) return;
  const src = slideSrc, gain = slideGain, t = actx.currentTime;
  gain.gain.cancelScheduledValues(t);
  gain.gain.setTargetAtTime(0, t, 0.04);
  setTimeout(() => { try { src.stop(); src.disconnect(); } catch (e) {} }, 250);
  slideSrc = null; slideGain = null; slideFilter = null;
}

function sfx(type) {
  const ctx = audio();
  if (!ctx || !save.sfx) return;
  const now = ctx.currentTime;
  try {
    if (type === 'bump') {
      // Body: a short low sine thump. Skin: a lowpassed noise tick on top.
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(72, now + 0.09);
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      o.connect(g).connect(sfxBus);
      o.start(now); o.stop(now + 0.14);

      const s = noiseSource(ctx), f = ctx.createBiquadFilter(), ng = ctx.createGain();
      f.type = 'lowpass'; f.frequency.value = 420;
      ng.gain.setValueAtTime(0.2, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      s.connect(f).connect(ng).connect(sfxBus);
      s.start(now); s.stop(now + 0.08);
      return;
    }
    if (type === 'grab' || type === 'place') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = type === 'grab' ? 520 : 330;
      g.gain.setValueAtTime(type === 'grab' ? 0.10 : 0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      o.connect(g).connect(sfxBus);
      o.start(now); o.stop(now + 0.1);
      return;
    }
    if (type === 'deny') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(200, now);
      o.frequency.exponentialRampToValueAtTime(140, now + 0.16);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.connect(g).connect(sfxBus);
      o.start(now); o.stop(now + 0.2);
      return;
    }
    if (type === 'hint') {
      [880, 1175].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = now + i * 0.09;
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g).connect(sfxBus);
        o.start(t); o.stop(t + 0.22);
      });
      return;
    }
    if (type === 'exit') {
      // Rising whoosh as the block clears the gap.
      const s = noiseSource(ctx), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass'; f.Q.value = 1.4;
      f.frequency.setValueAtTime(500, now);
      f.frequency.exponentialRampToValueAtTime(2600, now + 0.42);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.2, now + 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      s.connect(f).connect(g).connect(sfxBus);
      s.start(now); s.stop(now + 0.55);
      return;
    }
    if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const t = now + i * 0.11;
        marimba(ctx, f, t, 0.3, sfxBus);
      });
      return;
    }
  } catch (e) {}
}

// Struck-wood voice: a triangle fundamental plus a detuned, quieter octave that
// dies faster. Used for both the win flourish and the music.
function marimba(ctx, freq, t, amp, dest) {
  for (let k = 0; k < 2; k++) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = k ? 'sine' : 'triangle';
    o.frequency.value = freq * (k ? 4.01 : 1);
    const a = amp * (k ? 0.22 : 1);
    const dur = k ? 0.22 : 0.9;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(a, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }
}

// Generative ambience: a slow warm pad under sparse pentatonic plucks. No loop
// point to hear, and nothing to download.
let musicOn = false, musicTimer = 0, nextNote = 0, bar = 0, padNodes = null;
const PENT = [0, 2, 4, 7, 9, 12, 14, 16];
const CHORDS = [[0, 7, 16], [-3, 4, 12], [2, 9, 14], [-5, 2, 11]];
const ROOT = 146.83;   // D3
const hz = (semi) => ROOT * Math.pow(2, semi / 12);

function startMusic() {
  const ctx = audio();
  if (!ctx || musicOn) return;
  musicOn = true;
  musicBus.gain.cancelScheduledValues(ctx.currentTime);
  musicBus.gain.setTargetAtTime(0.5, ctx.currentTime, 1.2);

  // Pad: three detuned saws through a slowly breathing lowpass.
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = 520;
  filt.Q.value = 0.8;
  const padGain = ctx.createGain();
  padGain.gain.value = 0.055;
  filt.connect(padGain).connect(musicBus);

  const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
  lfo.frequency.value = 0.055;
  lfoGain.gain.value = 190;
  lfo.connect(lfoGain).connect(filt.frequency);
  lfo.start();

  const oscs = CHORDS[0].map((semi, i) => {
    const o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = hz(semi);
    o.detune.value = (i - 1) * 6;
    o.connect(filt);
    o.start();
    return o;
  });

  padNodes = { filt, padGain, lfo, oscs };
  nextNote = ctx.currentTime + 0.3;
  bar = 0;
  musicTimer = setInterval(schedule, 140);
}

function stopMusic() {
  if (!musicOn) return;
  musicOn = false;
  clearInterval(musicTimer);
  const t = actx.currentTime;
  musicBus.gain.cancelScheduledValues(t);
  musicBus.gain.setTargetAtTime(0, t, 0.5);
  const nodes = padNodes;
  padNodes = null;
  setTimeout(() => {
    if (!nodes) return;
    try {
      nodes.oscs.forEach((o) => { o.stop(); o.disconnect(); });
      nodes.lfo.stop(); nodes.lfo.disconnect();
      nodes.filt.disconnect(); nodes.padGain.disconnect();
    } catch (e) {}
  }, 2200);
}

// Lookahead scheduler: Web Audio is sample-accurate but setInterval is not, so
// notes are queued ahead of the clock rather than played on the tick.
function schedule() {
  if (!musicOn || !actx) return;
  const ahead = actx.currentTime + 0.4;
  while (nextNote < ahead) {
    const chord = CHORDS[Math.floor(bar / 8) % CHORDS.length];
    if (padNodes) {
      padNodes.oscs.forEach((o, i) => {
        o.frequency.setTargetAtTime(hz(chord[i]), nextNote, 1.6);
      });
    }
    // Sparse on purpose: this is a calm puzzle, and a busy line under it reads
    // as time pressure.
    if (Math.random() < 0.42) {
      const semi = chord[0] + PENT[Math.floor(Math.random() * PENT.length)] + 12;
      marimba(actx, hz(semi), nextNote, 0.16 + Math.random() * 0.09, musicBus);
    }
    if (bar % 4 === 0) marimba(actx, hz(chord[0] - 12), nextNote, 0.12, musicBus);
    nextNote += 0.42;
    bar++;
  }
}

function haptic(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
}

// ── Motion preference ────────────────────────────────────────────────────────
// Decorative motion goes; motion the player *caused* stays. A slide still
// slides, because a block teleporting between cells is worse feedback rather
// than gentler feedback. What stops is everything the board does on its own:
// drifting dust, the breathing exit marker, hint pulses, squash, confetti,
// camera shake. With all of that off the scene is genuinely static between
// inputs, which is what lets the render loop stop drawing entirely.
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;

renderer.shadowMap.needsUpdate = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 1, 200);
const camBase = new THREE.Vector3();
const camTarget = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xffe4c0, 0x20150c, 0.44));

keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
