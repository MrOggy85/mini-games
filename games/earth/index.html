<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/games/earth/manifest.json">
<link rel="icon" href="/games/earth/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/games/earth/apple-touch-icon.png">
<title>Living Earth</title>
<style>
:root {
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-right: env(safe-area-inset-right, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
  --sa-left: env(safe-area-inset-left, 0px);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #0b1030;
  touch-action: none;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Segoe UI', sans-serif;
}

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* The two top controls sit on a moving picture, so both are pills with a
   translucent plate rather than bare text. */
.top {
  position: fixed;
  top: calc(var(--sa-top) + 10px);
  z-index: 5;
  display: flex;
  align-items: center;
  min-height: 44px;
  border-radius: 22px;
  background: rgba(10, 16, 40, 0.72);
  color: #dfe6f5;
  font-size: 14px;
  font-weight: 600;
}
.back-link {
  left: calc(var(--sa-left) + 12px);
  padding: 0 16px;
  text-decoration: none;
  transition: color 0.15s;
}
.back-link:hover { color: #8ec3ff; }
#langs { right: calc(var(--sa-right) + 12px); padding: 0 4px; }
#langs button {
  min-width: 44px;
  min-height: 44px;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 13px;
  border-radius: 22px;
  cursor: pointer;
}
#langs button.on { background: #ffd24a; color: #23304a; }

/* Spot names float over the map in screen pixels, so they stay one readable
   size however far the camera is pulled back. */
#labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; transition: opacity 0.25s; }
#labels.hide { opacity: 0; }
.label {
  position: absolute;
  left: 0; top: 0;
  max-width: 150px;
  padding: 4px 10px;
  border-radius: 14px;
  background: rgba(10, 16, 40, 0.78);
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#intro {
  position: fixed;
  left: 50%;
  bottom: calc(var(--sa-bottom) + 12px);
  transform: translateX(-50%);
  z-index: 2;
  max-width: calc(100% - 24px);
  padding: 10px 18px;
  border-radius: 22px;
  background: rgba(10, 16, 40, 0.85);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
  transition: opacity 0.25s;
}
#intro b { color: #ffd24a; margin-right: 8px; }
#intro.hide { opacity: 0; }


#sheet {
  position: fixed;
  z-index: 4;
  background: #fff9ec;
  color: #23304a;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  touch-action: pan-y;
  transition: transform 0.45s cubic-bezier(.2, .8, .2, 1);
  border-top: 6px solid var(--accent, #ffd24a);
}
/* Portrait: a sheet from the bottom. Landscape: a column on the right. The
   min-height keeps the sheet from changing size on every story phase, which
   would otherwise reframe the camera each time. */
@media (orientation: portrait) {
  #sheet {
    left: 0; right: 0; bottom: 0;
    min-height: 30vh;
    max-height: 56vh;
    padding: 14px calc(var(--sa-right) + 18px) calc(var(--sa-bottom) + 12px) calc(var(--sa-left) + 18px);
    border-radius: 22px 22px 0 0;
    transform: translateY(110%);
  }
}
@media (orientation: landscape) {
  #sheet {
    top: 0; right: 0; bottom: 0;
    width: min(390px, 42vw);
    padding: calc(var(--sa-top) + 64px) calc(var(--sa-right) + 18px) calc(var(--sa-bottom) + 14px) 18px;
    border-top: 0;
    border-left: 6px solid var(--accent, #ffd24a);
    border-radius: 22px 0 0 22px;
    transform: translateX(110%);
  }
}
#sheet.open { transform: none; }
/* Japanese for kids is written with spaces between phrases: break there. */
:lang(ja) #sheet { word-break: keep-all; overflow-wrap: anywhere; }
#s-head { display: flex; align-items: center; gap: 12px; }
#s-emoji { font-size: 38px; line-height: 1; }
#s-name { font-size: 13px; font-weight: 800; color: #5b6785; }
#s-title { font-size: 21px; line-height: 1.2; }
#s-dots { display: flex; gap: 6px; }
#s-dots i { width: 24px; height: 7px; border-radius: 4px; background: #dde3ef; }
#s-dots i.done { background: #23304a; }
#s-dots i.on { background: var(--accent, #ffd24a); box-shadow: inset 0 0 0 1.5px #23304a; }

/* The story card: what is about to happen, what is happening, what happened. */
#s-card {
  border-radius: 18px;
  padding: 10px 14px 12px;
  border: 2px solid #d9ccff;
  background: #f4efff;
}
#s-card[data-ph="now"] { background: #fff2dc; border-color: #ffd79a; }
#s-card[data-ph="done"] { background: #e7f7ec; border-color: #b4e5c4; }
#s-card[data-ph="free"] { background: #ffeef5; border-color: #ffc4dc; }
#s-phase { font-size: 13px; font-weight: 800; margin-bottom: 4px; color: #4b3a99; }
#s-card[data-ph="now"] #s-phase { color: #8a4a00; }
#s-card[data-ph="done"] #s-phase { color: #17663a; }
#s-card[data-ph="free"] #s-phase { color: #9c1f55; }
#s-say { font-size: 16px; line-height: 1.5; }

#s-do { display: flex; flex-wrap: wrap; gap: 8px; }
#s-do .hint {
  flex: 1 1 100%;
  padding: 12px 14px;
  border-radius: 16px;
  background: #ffe9a8;
  font-size: 16px;
  font-weight: 800;
  text-align: center;
  animation: bob 1.4s ease-in-out infinite;
}
#s-do .wait { flex: 1 1 100%; text-align: center; font-size: 28px; font-weight: 900; line-height: 1; color: #d97a00; }
#s-do .wait span { animation: blink 1s infinite; }
#s-do .wait span:nth-child(2) { animation-delay: 0.2s; }
#s-do .wait span:nth-child(3) { animation-delay: 0.4s; }
#s-do button {
  flex: 1 1 130px;
  min-height: 52px;
  padding: 6px 10px;
  border: 3px solid #23304a;
  border-radius: 18px;
  background: #fff;
  color: #23304a;
  font: inherit;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
#s-do button.alt { border-color: #b9c3d9; background: #eef2f9; font-size: 15px; }
#s-do button.go { background: #23304a; color: #fff; }
#s-do button:active { transform: scale(0.97); }
.nudge { animation: nudge 0.45s; }
@keyframes bob { 50% { transform: scale(1.03); } }
@keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes nudge { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) {
  #s-do .hint, #s-do .wait span, .nudge { animation: none; }
  #sheet, #labels, #intro { transition: none; }
}

.nav { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.nav button {
  flex: 1;
  min-height: 44px;
  border: 0;
  border-radius: 22px;
  background: #e4ebf7;
  color: #23304a;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.nav button#b-map { background: #5b6785; color: #fff; flex: 1.4; }
.nav button:active { filter: brightness(0.9); }
</style>
</head>
<body>
<svg id="world" xmlns="http://www.w3.org/2000/svg" aria-label="Living Earth"></svg>
<div id="labels"></div>
<a href="/" class="top back-link">&larr; All Games</a>
<div class="top" id="langs">
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="ja">日本語</button>
  <button type="button" data-lang="sv">SV</button>
</div>
<div id="intro"><b>🌏</b><span id="intro-text"></span></div>
<div id="sheet" role="dialog" aria-live="polite">
  <div id="s-head">
    <span id="s-emoji" aria-hidden="true"></span>
    <div><div id="s-name"></div><h2 id="s-title"></h2></div>
  </div>
  <div id="s-dots" aria-hidden="true"></div>
  <div id="s-card" data-ph="ask">
    <div id="s-phase"></div>
    <p id="s-say"></p>
  </div>
  <div id="s-do"></div>
  <div class="nav">
    <button type="button" id="b-prev" aria-label="Previous">&lsaquo;</button>
    <button type="button" id="b-map">&larr; <span id="b-map-t"></span></button>
    <button type="button" id="b-next" aria-label="Next">&rsaquo;</button>
  </div>
</div>

<script>
(function () {
'use strict';

// ---------------------------------------------------------------------------
// Living Earth. One tall cross-section of the planet, from space down to the
// plates under our feet, drawn as a single SVG "world". Each phenomenon is a
// tile on that map. Tapping a tile moves the camera (the SVG viewBox) in on it
// and opens its story.
//
// A story is a few steps, and each step runs the same three beats so the
// child is shown rather than told: it says what is about to happen (or asks
// them to guess), lets them do it — a tap on the picture or a choice in the
// sheet — narrates what is happening while the picture plays, then explains
// what happened and why. A choice's explanation is keyed by what they chose,
// so it can say "this happened, and not that", and offers the other choice
// to try. Hazards end with a "what would you do?" step about staying safe.
// After the last step the tile is free to play with.
//
// Each tile is authored in its own local coordinates (0,0 = its top-left) and
// owns an update(dt, ad) that animates it. `ad` is the "alive" time step: it is
// the real dt normally, and 0 under prefers-reduced-motion until the player
// pokes the tile, so the map is genuinely still unless asked to move.
// ---------------------------------------------------------------------------
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ------------------------------------------------------------- translations
const UI = {
  en: {
    title: 'Living Earth', intro: 'Tap a picture to find out why!', map: 'Map', prev: 'Previous', next: 'Next',
    ph: { ask: '🤔 What will happen?', now: '👀 Look!', done: '💡 What happened?', free: '🎉 You found out!' },
    go: 'Next ➜', finish: 'Done 🎉', again: '🔁 Again', try: 'Try', restart: '↺ Start over', freeDone: 'Now play as much as you like.', boom: 'BOOM!',
  },
  ja: {
    title: 'いきている ちきゅう', intro: 'しりたい えを タップ！', map: 'ちず', prev: 'まえ', next: 'つぎ',
    ph: { ask: '🤔 どうなる かな？', now: '👀 みて！', done: '💡 なにが おきた？', free: '🎉 わかったね！' },
    go: 'つぎ ➜', finish: 'おしまい 🎉', again: '🔁 もういちど', try: 'ためす', restart: '↺ さいしょから', freeDone: 'あとは じゆうに あそんでね。', boom: 'ゴロゴロ！',
  },
  sv: {
    title: 'Levande jord', intro: 'Tryck på en bild och ta reda på varför!', map: 'Karta', prev: 'Föregående', next: 'Nästa',
    ph: { ask: '🤔 Vad tror du händer?', now: '👀 Titta!', done: '💡 Vad hände?', free: '🎉 Nu vet du!' },
    go: 'Nästa ➜', finish: 'Klar 🎉', again: '🔁 Igen', try: 'Testa', restart: '↺ Börja om', freeDone: 'Nu kan du leka fritt.', boom: 'PANG!',
  },
};

// Story text, one entry per tile. `s` lines up with that tile's `steps`:
//   ask   what is about to happen, or a question to guess at
//   do    what to tap, for a step acted on the picture
//   more  progress line for a step that needs several taps ({n} = taps left)
//   pick  the choice labels, for a step acted on with a choice; the first
//         token (the emoji) is also what a safety step pins on the picture
//   now   what is happening while the picture plays
//   done  what happened and why
// `now` and `done` are either a string or keyed by the outcome.
const TXT = {
  aurora: {
    e: '🌌',
    en: {
      name: 'Aurora', q: 'Why does the sky glow?', free: 'Tap to send more sun bits!',
      s: [
        { ask: 'The Sun is always blowing out tiny bits, too small to see. What happens when they reach the Earth?', do: 'Tap to send sun bits!', now: 'Whoosh! The bits fly to Earth. Earth is a giant magnet, and it pulls them toward the North and South Poles…', done: 'The bits crashed into the air high above the pole, and the air lit up! That glow is the aurora.' },
        { ask: 'Sometimes the Sun sends just a puff, sometimes a big storm. Which makes a brighter aurora?', pick: { small: '🌤️ A small puff', big: '🌞 A big sun storm' }, now: 'Here they come…', done: { small: 'Just a soft glow. A small puff means only a few bits hit the air.', big: 'WOW! A sun storm sends so many bits that the whole sky dances. Then people far from the poles can see it too!' } },
        { ask: 'The aurora has different colours, because each gas in the air glows its own colour. Which gas shall we light up?', pick: { green: '💚 Oxygen', pink: '💜 Nitrogen' }, now: 'Zap! The bits hit the gas…', done: { green: 'Oxygen glows green — the most common aurora colour.', pink: 'Nitrogen glows pink and purple, often along the bottom edge of the curtains.' } },
      ],
    },
    ja: {
      name: 'オーロラ', q: 'どうして そらが ひかるの？', free: 'タップして もっと つぶを とばそう！',
      s: [
        { ask: 'たいようは いつも、めに みえない ちいさな つぶを ふきだして いるよ。ちきゅうに とどくと どうなる かな？', do: 'タップして たいようの つぶを とばそう！', now: 'ビューン！ ちきゅうは おおきな じしゃく。つぶは きたと みなみの はし（きょく）に ひっぱられて…', done: 'つぶが きょくの たかい そらで くうきに ぶつかって、くうきが ひかった！ これが オーロラ だよ。' },
        { ask: 'たいようは つぶを ちょっとだけ だす ときと、たくさん だす「たいようの あらし」の ときが あるよ。どっちが あかるい かな？', pick: { small: '🌤️ ちょっとだけ', big: '🌞 たいようの あらし' }, now: 'きたよ…', done: { small: 'ぼんやり ひかった だけ。つぶが すこし だと、すこし しか ひからないよ。', big: 'すごい！ つぶが たくさん きて、そら いっぱいに おどってる！ きょくから とおい まちでも みえる ことが あるよ。' } },
        { ask: 'くうきの なかの ガスは、それぞれ ちがう いろに ひかるよ。どれを ひからせる？', pick: { green: '💚 さんそ', pink: '💜 ちっそ' }, now: 'ビリッ！ つぶが ガスに あたって…', done: { green: 'さんそは みどりに ひかるよ。いちばん よく みる オーロラの いろ だね。', pink: 'ちっそは ピンクや むらさきに ひかるよ。カーテンの したの ふちに よく みえるんだ。' } },
      ],
    },
    sv: {
      name: 'Norrsken', q: 'Varför lyser himlen?', free: 'Tryck för att skicka fler solpartiklar!',
      s: [
        { ask: 'Solen blåser hela tiden ut pyttesmå partiklar, för små för att se. Vad händer när de når jorden?', do: 'Tryck för att skicka solpartiklar!', now: 'Svisch! Partiklarna flyger mot jorden. Jorden är en jättemagnet som drar dem mot nordpolen och sydpolen…', done: 'Partiklarna krockade med luften högt över polen, och luften började lysa! Det skenet är norrsken.' },
        { ask: 'Ibland skickar solen bara en liten pust, ibland en stor solstorm. Vilken ger starkast norrsken?', pick: { small: '🌤️ En liten pust', big: '🌞 En stor solstorm' }, now: 'Här kommer de…', done: { small: 'Bara ett svagt sken. En liten pust betyder att bara några få partiklar träffar luften.', big: 'WOW! En solstorm skickar så många partiklar att hela himlen dansar. Då kan man se norrsken ända ner i södra Sverige!' } },
        { ask: 'Norrskenet har olika färger, för varje gas i luften lyser i sin egen färg. Vilken gas ska vi tända?', pick: { green: '💚 Syre', pink: '💜 Kväve' }, now: 'Zapp! Partiklarna träffar gasen…', done: { green: 'Syre lyser grönt — den vanligaste norrskensfärgen.', pink: 'Kväve lyser rosa och lila, ofta längst ner i kanten av ridåerna.' } },
      ],
    },

  satellite: {
    e: '🛰️',
    en: {
      name: 'Satellites', q: "Why doesn't a satellite fall down?", free: 'Tap to take another picture!',

        { ask: 'Satellites take pictures of clouds and storms. How does the picture get down to us?', do: 'Tap to take a picture!', now: 'Click! The picture is sent as invisible radio waves…', done: "The dish on the ground caught the picture! Weather forecasters use these to see storms coming, and the map on a phone uses satellites too." },
      ],
    },
    ja: {
      name: 'じんこうえいせい', q: 'どうして えいせいは おちて こないの？', free: 'タップして もう 1まい とろう！',
      s: [
        { ask: 'じつは えいせいは ずっと おちつづけて いるんだ！ でも よこにも とんで いる。ゆっくり だったら どうなる？', pick: { slow: '🐢 ゆっくり', fast: '🚀 ものすごく はやく' }, now: { slow: 'おそすぎる…', fast: 'ビューン！' }, done: { slow: 'おそすぎて おちて しまい、くうきで もえて ながれぼし みたいに なった！ えいせいは はやく ないと だめ なんだ。', fast: 'はやすぎて、おちても おちても ちきゅうの まわりを まわりつづける！ これを「きどう」と いうよ。1しゅう やく 90ぷん。' } },
        { ask: 'えいせいは くもや たいふうの しゃしんを とるよ。しゃしんは どうやって とどく かな？', do: 'タップして しゃしんを とろう！', now: 'パシャ！ しゃしんは めに みえない でんぱに なって…', done: 'じめんの アンテナが しゃしんを うけとった！ てんきよほうの ひとは これで あらしが くるのを しるよ。スマホの ちずも えいせいを つかって いるんだ。' },

    },
    sv: {
      name: 'Satelliter', q: 'Varför ramlar inte satelliten ner?', free: 'Tryck för att ta en bild till!',

      ],
    },
  },
  wind: {
    e: '🌬️',
    en: {
      name: 'Wind & clouds', q: 'Where does wind come from?', free: 'Tap to blow a gust!',
      s: [
        { ask: 'The Sun warms the ground, and the ground warms the air. What does warm air do?', do: 'Tap the Sun!', now: 'Look at the red arrows: the warm air floats up, like a hot-air balloon…', done: 'Cool air (the blue arrows) slid in to fill the space. Air moving from place to place — that is wind!' },
        { ask: 'What happens if the Sun is weak — or really strong?', pick: { weak: '🌥️ Weak Sun', strong: '☀️ Strong Sun' }, now: 'Watch the wind turbine…', done: { weak: 'Only a gentle breeze. A little warming makes a little wind.', strong: 'A big gust! More warm air rising means more cool air rushing in. The turbine spins fast and makes electricity.' } },
      ],
    },
    ja: {
      name: 'かぜと くも', q: 'かぜは どこから くるの？', free: 'タップして かぜを ふかせよう！',

// A fixed set of reusable elements. Spawning never allocates, so a burst of
// particles on an iPad doesn't churn the garbage collector.
class Pool {

      el.style.display = 'none';

      this.a.push({ el, on: false, age: 0 });

    for (const p of this.a) {

  s.update = (dt, ad) => {

    boost = Math.max(0, boost - ad * 0.3);
    hlT = Math.max(0, hlT - ad);
    const hk = smooth(hlT / 1.2);
    twinkle(st, T);
    rays.setAttribute('transform', `rotate(${f1(T * 12)})`);
    cur.forEach((p, i) => {
      const on = hl === i ? hk : 0, off = hl >= 0 && hl !== i ? hk : 0;
      const N = 22, x0 = cols[i][1], x1 = cols[i][2];
      const top = [], base = [];
      for (let j = 0; j <= N; j++) {
        const x = lerp(x0, x1, j / N);
        const b = baseY(x) + 6;
        const hgt = (46 + 34 * Math.sin(j * 0.55 + T * 1.1 + i * 2) + 14 * Math.sin(j * 1.3 - T * 1.7)) * (0.85 + boost * 0.55) * (1 + on * 0.4);
        top.push([x, b - hgt]);
        base.push([x, b]);
      }
      p.setAttribute('d', polyOf(top.concat(base.reverse())));

  };
  s.tap = () => { burst(16); s.wake = 6; };
  s.steps = [
    { act: () => burst(16), wait: 2.6 },
    { pick: ['small', 'big'], enter: () => { boost = 0; }, act: (k) => burst(k === 'big' ? 44 : 4, k === 'big'), wait: 2.8 },
    { pick: ['green', 'pink'], act: (k) => { hl = k === 'green' ? 0 : 2; hlT = 7; burst(14); }, wait: 2.2 },
  ];
});

// ---------------------------------------------------------------- tornado
makeSpot('tornado', 408, 578, 384, 296, [0, 0, 384, 296], '#9aa7b8', (s) => {

  const layers = [];

  let tx = 192, target = 192, lean = 0, reach = 1, reachTo = 1, rise = 0;
  s.update = (dt, ad) => {

    reach = lerp(reach, reachTo, 1 - Math.exp(-ad * (reachTo > reach ? 0.9 : 2.5)));
    const down = reach > 0.9;

    for (let i = 0; i < N; i++) {

      const ox = lean * u * 1.4 + Math.sin(T * 3.2 + i * 0.6) * (3 + 10 * (1 - u)) * 0.6;
      A(layers[i], { cx: f1(tx + ox), cy: f1(y), rx: f1(rx + Math.sin(T * 5 + i) * 1.5), ry: f1(lerp(11, 4, u)), opacity: smooth((reach * 1.08 - u) * 6).toFixed(2) });
    }
    houses.forEach((hh) => {

    });
    deb.step(ad, (p, d) => {
      p.h += d * 0.55; p.a += d * (6 - p.h * 2);
      if (p.h >= 1) return false;
      const u = p.h;
      const y = lerp(252, 76, u), rx = lerp(8, 70, u) + p.r * u;
      const cx = tx + lean * (1 - u) * 1.4 + Math.cos(p.a) * rx;
      mv(p.el, cx, y + Math.sin(p.a) * 6, p.a * 60);
      p.el.setAttribute('opacity', (1 - smooth((u - 0.8) / 0.2)).toFixed(2));
    });

    target = clamp(x, 52, w - 52);

    { enter: () => { reachTo = 1; }, act: (k, x) => { s.tap(x); return houses.some((hh) => Math.abs(hh.x - target) < 44) ? 'house' : 'field'; }, wait: 2.6 },
    { pick: ['window', 'basement', 'car'], safe: ['basement'], enter: () => { reachTo = 1; }, act: () => s.tap(target > 192 ? 70 : 314), wait: 2.6 },
  ];
});

  for (let k = 0; k < 4; k++) {
    const pts = [];

    const d = pathOf(pts);
    for (const [sw, op] of [[24, 0.28], [14, 0.5], [6, 0.9]]) E('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': sw, 'stroke-linecap': 'round', opacity: op }, body);
  }

  const spray = new Pool(c, 20, () => E('rect', { width: 10, height: 2.4, rx: 1.2, fill: '#fff' }));
  // Power relaxes toward what the water underneath can feed it.

    eyeT = Math.max(0, eyeT - ad);

    const sc = 0.5 + pow * 0.42;

    mv(sh, Math.sin(T * 60) * 3 * quake, Math.cos(T * 52) * 2 * quake);
    A(chamber, { rx: f1(96 + pr * 10), ry: f1(36 + pr * 7), opacity: (0.88 + 0.12 * Math.sin(T * (2 + pr * 10) + er * 6)).toFixed(2) });
    A(rim, { rx: f1(96 + pr * 10), ry: f1(36 + pr * 7) });
    const gh = 72 * clamp(pr, 0, 1);
    A(gauge, { y: f1(298 - gh), height: f1(gh), fill: pr > 0.66 ? '#ff4a2b' : pr > 0.33 ? '#ff9a2b' : '#ffd24a' });
    A(crater, { fill: er > 0 ? '#ffe45c' : '#ff9a2b' });
    flashC.setAttribute('opacity', (kind === 'runny' ? 0 : Math.max(0, er - 0.6)).toFixed(2));
    if (flowP > 0 || (er > 0 && kind !== 'thick')) {
      flowP = Math.min(1.001, flowP + ad / (kind === 'runny' ? 2.4 : 3.2));
      flowOp = er > 0 ? 1 : Math.max(0, flowOp - ad / 4);
      flows.forEach((f) => A(f.p, { 'stroke-dashoffset': f1(f.len * (1 - ease(Math.min(1, flowP)))), opacity: flowOp.toFixed(2), 'stroke-width': kind === 'runny' ? 12 : 9 }));
      if (er <= 0 && flowOp <= 0) { flowP = 0; flows.forEach((f) => A(f.p, { 'stroke-dashoffset': f.len })); }
    }
    if (ad > 0 && Math.random() < ad * (2.5 + pr * 14)) bub.spawn((p) => { p.x = 192 + rnd(-70, 70); p.y = 285; p.vx = rnd(-8, 8); });
    bub.step(ad, (p, d) => {
      p.y -= (18 + pr * 20) * d; p.x += p.vx * d;

    });
    const rate = er > 0 ? (kind === 'thick' ? 30 : kind === 'runny' ? 5 : 16) : 1.6;
    if (ad > 0 && Math.random() < ad * rate) smoke.spawn((p) => { p.x = 192 + rnd(-10, 10); p.er = er > 0; p.big = er > 0 && kind === 'thick'; });

      A(p.el, { cx: f1(p.x), cy: f1(p.y), r: f1(p.r) });
    });
  };
  const erupt = (k) => {
    kind = k;
    er = 1; quake = k === 'thick' ? 1.4 : k === 'runny' ? 0.5 : 1;
    if (k !== 'thick') flowP = Math.max(0.001, flowP);
    const n = k === 'thick' ? 40 : k === 'runny' ? 8 : 24;
    for (let i = 0; i < n; i++) bombs.spawn((p) => {

  const calm = () => {

    flows.forEach((f) => A(f.p, { 'stroke-dashoffset': f.len, opacity: 0 }));

      enter: () => { prTo = 0; },

        prTo = n / 3;
        quake = Math.max(quake, 0.2 * n);
        if (n >= 3) after(s, 0.7, () => { prTo = 0; erupt('mid'); });
      },
      wait: 3,
    },
    { pick: ['runny', 'thick'], enter: calm, act: (k) => erupt(k), wait: 3.4 },
    { pick: ['look', 'leave'], safe: ['leave'], cardAt: [312, 60], enter: () => { calm(); prTo = 0.8; }, act: () => after(s, 0.4, () => { prTo = 0; erupt('thick'); }), wait: 2.6 },
  ];
  s.free = () => { prTo = 0; };
});

  const powder = new Pool(c, 30, () => E('circle', { fill: '#fff' }));

    weak.setAttribute('opacity', smooth((fk - 0.5) / 0.4).toFixed(2));

    if (ad > 0 && Math.random() < ad * (snowT > 0 ? 70 : 8)) flakes.spawn((p) => { p.x = rnd(0, w); p.y = -4; p.ph = rnd(0, TAU); p.v = snowT > 0 ? rnd(50, 80) : 28; });
    flakes.step(ad, (p, d) => {

makeSpot('tsunami', 808, 888, 384, 312, [0, 0, 384, 312], '#2aa7ff', (s) => {
  const c = s.c, w = s.w, h = s.h;
  const sh = E('g', null, c);
  E('rect', { width: w, height: h, fill: G([[0, '#8fd0ff'], [1, '#e9f6ff']]) }, sh);
  E('circle', { cx: 60, cy: 48, r: 22, fill: '#ffe27a' }, sh);
  cloud(sh, 250, 44, 0.8, '#fff', 0.9);
  // The sea floor shelves up to a beach, a town, and a hill behind it that is
  // taller than any wave.
  const BED = [[0, 292], [150, 268], [230, 206], [285, 156], [318, 130], [342, 118], [366, 64], [384, 56]];
  const bed = (x) => { for (let i = 0; i < BED.length - 1; i++) if (x <= BED[i + 1][0]) return lerp(BED[i][1], BED[i + 1][1], (x - BED[i][0]) / (BED[i + 1][0] - BED[i][0])); return BED[BED.length - 1][1]; };
  const SEA = 142, WALL = 298, WALL_TOP = 78;
  // A town on the shore, drawn before the water so a flood can cover it.
  const town = [314, 334].map((hx, i) => {
    const g = E('g', null, sh);
    E('rect', { x: -10, y: -16, width: 20, height: 16, fill: i ? '#9bd0f5' : '#ffd24a' }, g);
    E('path', { d: 'M-13,-16 L0,-28 L13,-16Z', fill: '#e0524f' }, g);
    E('rect', { x: -3, y: -8, width: 6, height: 8, fill: '#8d6e63' }, g);
    mv(g, hx, bed(hx) + 1);
    return { g, x: hx, y: bed(hx) + 1 };
  });
  E('path', { d: polyOf(BED.concat([[384, h], [0, h]])), fill: '#e8cf98' }, sh);
  E('path', { d: polyOf([[342, 118], [366, 64], [384, 56], [384, 124], [342, 124]]), fill: '#7cc48a' }, sh);
  E('path', { d: pathOf(BED), fill: 'none', stroke: '#c4a86b', 'stroke-width': 4 }, sh);
  const kidG = kid(sh);
  kidG.style.display = 'none';
  const wall = E('rect', { x: WALL - 4, y: WALL_TOP, width: 9, height: bed(WALL) - WALL_TOP + 2, rx: 2, fill: '#8f9bb0', stroke: '#5f6a80', 'stroke-width': 2 }, sh);
  const water = E('path', { fill: G([[0, '#3db4ff', 0.88], [1, '#0b4fa0', 0.95]]) }, sh);
  const foam = E('path', { fill: 'none', stroke: '#fff', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, sh);
  const boat = E('g', null, sh);
  E('path', { d: 'M-16,0 H16 L11,9 H-11Z', fill: '#e0524f' }, boat);
  E('path', { d: 'M0,-3 V-24 L14,-6Z', fill: '#fff', stroke: '#c9d0dc', 'stroke-width': 1 }, boat);
  const ring = E('circle', { r: 22, fill: 'none', stroke: '#ff3b3b', 'stroke-width': 4, opacity: 0 }, sh);
  const rings = new Pool(sh, 3, () => E('circle', { fill: 'none', stroke: '#ffd24a', 'stroke-width': 3 }));
  const spray = new Pool(sh, 16, () => E('circle', { r: 3, fill: '#fff' }));
  const star = E('path', { d: 'M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4Z', fill: '#ffd24a', opacity: 0 }, sh);
  let wave = null, shk = 0, wallOn = false, kidOn = false, kidX = 320, kidTX = 320, danger = 0;
  const N = 64;
  const surf = (x, T) => {
    let y = SEA + 2.6 * Math.sin(x * 0.04 + T * 1.6) + 1.8 * Math.sin(x * 0.09 - T * 1.1);
    if (wave) {
      // The crest, with a trough running ahead of it: the sea pulls back
      // from the beach just before the wave arrives.
      const sg = wave.sig, d1 = (x - wave.px) / sg, d2 = (x - wave.px - sg * 1.9) / (sg * 1.1);
      y -= wave.amp * (Math.exp(-d1 * d1) - 0.35 * Math.exp(-d2 * d2));
    }
    if (wallOn) y = Math.max(y, WALL_TOP + 3);
    return y;
  };
  const level = (x, T) => (wallOn && x > WALL ? bed(x) : Math.min(surf(x, T), bed(x)));
  s.update = (dt, ad) => {
    const T = s.T;
    shk = Math.max(0, shk - ad * 1.6);
    danger = Math.max(0, danger - ad * 0.2);
    mv(sh, Math.sin(T * 55) * 2.5 * shk, Math.cos(T * 47) * 2 * shk);
    if (wave) {
      const depth = clamp((bed(wave.px) - SEA) / 150, 0, 1);
      wave.px += (46 + 70 * depth) * ad;
      const grow = smooth((wave.px - 130) / 190);
      wave.amp = (12 + 58 * grow) * (wave.px > 400 ? Math.max(0, 1 - (wave.px - 400) / 130) : 1);
      wave.sig = lerp(44, 24, grow);
      if (wallOn && Math.abs(wave.px - WALL) < 30 && ad > 0 && Math.random() < ad * 30) spray.spawn((p) => { p.x = WALL - rnd(0, 10); p.y = WALL_TOP + rnd(0, 10); p.vx = rnd(-60, 10); p.vy = rnd(-160, -80); });
      if (wave.px > 540) wave = null;
    }
    wall.style.display = wallOn ? '' : 'none';
    const top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const x = (i / N) * w;
      top.push([x, level(x, T)]);
      bot.push([x, bed(x)]);
    }
    water.setAttribute('d', polyOf(top.concat(bot.reverse())));
    foam.setAttribute('d', pathOf(top));
    const by = surf(130, T);
    mv(boat, 130, by - 5, Math.atan2(surf(138, T) - surf(122, T), 16) * 57.3, 0.9);
    for (const t of town) {
      const depthW = bed(t.x) - level(t.x, T);
      const k = clamp((depthW - 5) / 40, 0, 1);
      mv(t.g, t.x - k * 4, t.y, -k * 16);
    }
    kidG.style.display = kidOn ? '' : 'none';
    if (kidOn) {
      kidX += clamp(kidTX - kidX, -60 * ad, 60 * ad);
      const walking = Math.abs(kidTX - kidX) > 0.5;
      mv(kidG, kidX, bed(kidX) + 1, walking ? Math.sin(T * 14) * 5 : 0, 0.7);
      if (bed(kidX) - level(kidX, T) > 10) danger = 1;
    }
    A(ring, { cx: f1(kidX), cy: f1(bed(kidX) - 14), r: f1(20 + Math.sin(T * 9) * 3), opacity: (kidOn ? Math.min(1, danger * 3) * (0.6 + 0.4 * Math.sin(T * 10)) : 0).toFixed(2) });
    spray.step(ad, (p, d) => {
      p.vy += 400 * d; p.x += p.vx * d; p.y += p.vy * d;
      if (p.age > 0.8) return false;
      A(p.el, { cx: f1(p.x), cy: f1(p.y), opacity: (1 - p.age / 0.8).toFixed(2) });
    });
    rings.step(ad, (p) => {
      if (p.age < 0) { p.el.setAttribute('opacity', 0); return; }
      const u = p.age / 1.1;
      if (u >= 1) return false;
      A(p.el, { cx: 90, cy: 282, r: f1(6 + u * 60), opacity: (1 - u).toFixed(2) });
    });
    star.setAttribute('opacity', Math.max(0, shk - 0.3).toFixed(2));
    mv(star, 90, 282, T * 120, 0.8 + shk);
  };
  const launch = () => {
    wave = { px: 90, amp: 12, sig: 44 };
    shk = 1;
    for (let i = 0; i < 3; i++) rings.spawn((p) => { p.age = -i * 0.25; });
  };
  s.tap = () => { launch(); s.wake = 14; };
  s.steps = [
    { enter: () => { wave = null; kidOn = false; wallOn = false; }, act: launch, wait: 4.5 },
    {
      pick: ['look', 'high'], safe: ['high'], cardAt: [70, 66],
      enter: () => { wave = null; wallOn = false; kidOn = true; kidX = kidTX = 320; danger = 0; },
      act: (k) => { shk = 1; kidTX = k === 'look' ? 298 : 378; after(s, 0.9, launch); },
      wait: 5,
    },
    {
      pick: ['wall', 'none'], safe: ['wall'], cardAt: [70, 66],
      enter: () => { wave = null; wallOn = false; kidOn = true; kidX = kidTX = 378; danger = 0; },
      act: (k) => { wallOn = k === 'wall'; after(s, 0.5, launch); },
      wait: 4.6,
    },
  ];
  s.free = () => { kidOn = false; };
  s.update(0, 0);
});

makeSpot('currents', 808, 1214, 384, 296, [0, 0, 384, 296], '#ff8c42', (s) => {
  const c = s.c, w = s.w, h = s.h;
  E('rect', { width: w, height: h, fill: G([[0, '#52c9d6'], [0.5, '#1d7fb8'], [1, '#0b2b66']]) }, c);
  // Sun on the left (warm), ice on the right (cold).
  E('circle', { cx: 28, cy: 24, r: 20, fill: '#ffd84a' }, c);
  E('path', { d: 'M330,0 Q350,34 384,30 V0Z', fill: '#eaf6ff' }, c);
  E('path', { d: `M0,${h} V268 Q100,252 200,270 T${w},262 V${h}Z`, fill: '#d9bf86' }, c);
  const weeds = [40, 120, 210, 300].map((x) => { const g = E('path', { fill: 'none', stroke: '#3fae6a', 'stroke-width': 4, 'stroke-linecap': 'round' }, c); return { g, x }; });
  // Loop: east along the surface, down at the cold end, back west deep down.
  const X0 = 48, X1 = 336, Y0 = 82, Y1 = 214, R = 44;
  const loopD = `M${X0 + R},${Y0} H${X1 - R} A${R},${R} 0 0 1 ${X1},${Y0 + R} V${Y1 - R} A${R},${R} 0 0 1 ${X1 - R},${Y1} H${X0 + R} A${R},${R} 0 0 1 ${X0},${Y1 - R} V${Y0 + R} A${R},${R} 0 0 1 ${X0 + R},${Y0}Z`;
  const loop = E('path', { d: loopD, fill: 'none', stroke: G([[0, '#ff8c42'], [1, '#4fc3f7']], { units: 'userSpaceOnUse', y1: Y0, y2: Y1 }), 'stroke-width': 22, opacity: 0.4 }, c);
  const len = loop.getTotalLength();
  const NS_ = 240, samp = [];
  for (let i = 0; i <= NS_; i++) { const p = loop.getPointAtLength((i / NS_) * len); samp.push([p.x, p.y]); }
  const at = (u) => {
    u = ((u % 1) + 1) % 1;
    const f = u * NS_, i = Math.floor(f), t = f - i;
    const a = samp[i], b = samp[Math.min(NS_, i + 1)];
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), Math.atan2(b[1] - a[1], b[0] - a[0]) * 57.3];
  };
  const colOf = (y) => { const k = clamp((y - Y0) / (Y1 - Y0), 0, 1); return `rgb(${Math.round(lerp(255, 120, k))},${Math.round(lerp(150, 215, k))},${Math.round(lerp(70, 255, k))})`; };
  const arrows = [];
  for (let i = 0; i < 30; i++) arrows.push(E('path', { d: 'M-6,-5 L6,0 L-6,5 L-2,0Z' }, c));
  // Big arrows for "cold water sinks here, warm water rises there".
  const big = [[X1 + 22, 1, '#4fc3f7'], [X0 - 22, -1, '#ff8c42']].map(([bx, dir, col]) => {
    const g = E('g', null, c);
    for (let i = 0; i < 3; i++) E('path', { d: `M-9,${i * 34 - 10} L0,${i * 34 + 4} L9,${i * 34 - 10}`, fill: 'none', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: dir < 0 ? `rotate(180 0 ${i * 34 - 3})` : '' }, g);
    return { g, x: bx, dir };
  });
  const fish = [0.04, 0.5].map((u) => { const g = E('g', null, c); E('ellipse', { rx: 9, ry: 5, fill: '#ffb84d' }, g); E('path', { d: 'M-8,0 L-15,-5 V5Z', fill: '#ffb84d' }, g); E('circle', { cx: 4, cy: -1, r: 1.3, fill: '#23304a' }, g); return { g, u }; });
  const ducks = [];
  const mkDuck = () => {
    const g = E('g', null, c);
    E('ellipse', { rx: 14, ry: 9, fill: '#ffd93d', stroke: '#e0a800', 'stroke-width': 1.5 }, g);
    E('circle', { cx: 9, cy: -10, r: 7, fill: '#ffd93d', stroke: '#e0a800', 'stroke-width': 1.5 }, g);
    E('path', { d: 'M15,-10 L22,-8 L15,-6Z', fill: '#ff8a3d' }, g);
    E('circle', { cx: 11, cy: -12, r: 1.4, fill: '#23304a' }, g);
    E('path', { d: 'M-6,-1 Q-1,-8 5,-1Z', fill: '#f2c200' }, g);
    return g;
  };
  let sinkT = 0;
  s.update = (dt, ad) => {
    const T = s.T;
    sinkT = Math.max(0, sinkT - ad);
    arrows.forEach((a, i) => { const p = at(i / arrows.length + T * 0.05); mv(a, p[0], p[1], p[2]); A(a, { fill: colOf(p[1]), stroke: '#fff', 'stroke-width': 1 }); });
    const bk = smooth(sinkT);
    for (const b of big) {
      b.g.style.display = bk > 0 ? '' : 'none';
      mv(b.g, b.x, 112 + ((T * 30) % 34) * b.dir, 0, 1);
      b.g.setAttribute('opacity', (bk * (b.dir > 0 ? 1 : 0.7)).toFixed(2));
    }
    fish.forEach((f) => { const p = at(f.u + T * 0.03); mv(f.g, p[0], p[1] + 20 * (p[1] < 100 ? 1 : 0.0), Math.abs(p[2]) > 90 ? p[2] + 180 : p[2], 1); });
    weeds.forEach((k) => { const sw = Math.sin(T * 1.5 + k.x) * 5; A(k.g, { d: `M${k.x},268 q${f1(sw)},-14 0,-26 t0,-24` }); });
    for (const d of ducks) {
      d.u += 0.05 * ad;
      const p = at(d.u);
      const bob = Math.sin(T * 3 + d.ph) * 2;
      const flip = Math.cos(p[2] / 57.3) < 0 ? -0.9 : 0.9;
      d.g.setAttribute('transform', `translate(${f1(p[0])} ${f1(p[1] - 10 + bob)}) scale(${flip} 0.9)`);
      d.g.setAttribute('opacity', p[1] > Y0 + 30 ? '0.4' : '1');
    }
  };
  s.tap = (x, y) => {
    // Snap to the nearest point of the loop.
    let bi = 0, bd = 1e9;
    for (let i = 0; i < NS_; i++) { const d = (samp[i][0] - x) ** 2 + (samp[i][1] - y) ** 2; if (d < bd) { bd = d; bi = i; } }
    if (ducks.length >= 5) { const o = ducks.shift(); o.g.remove(); }
    ducks.push({ g: mkDuck(), u: bi / NS_, ph: rnd(0, TAU) });
    s.wake = 10;
  };
  s.steps = [
    { act: (k, x, y) => s.tap(x, y), wait: 3 },
    { pick: ['float', 'sink'], act: () => { sinkT = 7; }, wait: 2.4 },
  ];
  s.tap(X0 + 100, Y0);
});

    // overshoots when it lets go.
    bv += ((stress * 1.8 - bend) * 60 - bv * 5) * ad;
    bend += bv * ad;
    mv(sh, Math.sin(T * 61) * 5 * q * q, Math.cos(T * 53) * 3.5 * q * q);
    land.setAttribute('transform', `rotate(${(-bend).toFixed(3)} 1204 158)`);
    strain.setAttribute('opacity', (smooth(stress / 0.4) * (0.7 + 0.3 * Math.sin(T * 12))).toFixed(2));
    strain.setAttribute('transform', `translate(${f1(rnd(-1, 1) * stress * 2)} ${f1(rnd(-1, 1) * stress * 2)})`);
    A(creep, { 'stroke-dashoffset': f1(-T * 7) });
    conv.forEach((k) => A(k.p, { 'stroke-dashoffset': f1(-T * 16 * k.dir) }));
    // Slabs lurch toward each other, then relax.
    mv(slab, slip * 7, 0);
    mv(a1, 260 + Math.sin(T * 1.2) * 6, 222, 0, 1);
    a2.setAttribute('transform', `translate(${f1(1020 - Math.sin(T * 1.2) * 3)} 210) scale(-0.8 0.8)`);
    // The nearer a house is to the quake, the harder it shakes.
    houses.forEach((hh, i) => {
      const k = q * clamp(1.15 - Math.abs(hh.x - ex) / 450, 0.12, 1);
      mv(hh.g, hh.x + Math.sin(T * 38 + i) * 4 * k, 155, Math.sin(T * 29 + i * 2) * 8 * k);
    });
    if (ad > 0 && Math.random() < ad * 1.5) bub.spawn((p) => { p.x = rnd(40, 1100); p.y = rnd(300, 390); });
    bub.step(ad, (p, d) => {
      p.y -= 14 * d;
      if (p.age > 3 || p.y < 270) return false;
      A(p.el, { cx: f1(p.x), cy: f1(p.y), r: f1(2 + Math.sin(p.age * 3) * 1.5), opacity: Math.min(0.9, (3 - p.age)).toFixed(2) });
    });
    rings.step(ad, (p) => {
      if (p.age < 0) { p.el.setAttribute('opacity', 0); return; }
      const u = p.age / 1.6;
      if (u >= 1) return false;
      A(p.el, { cx: f1(ex), cy: f1(ey), r: f1(10 + u * 300), 'stroke-width': f1(7 * (1 - u) + 1), opacity: (1 - u).toFixed(2) });
    });
    mv(star, ex, ey, T * 90, 0.5 + q * 0.8);
    star.setAttribute('opacity', Math.max(0, q * 1.4 - 0.2).toFixed(2));
    acc += ad;
    if (acc > 0.05) {
      acc = 0;
      tbuf.shift();
      tbuf.push((Math.random() * 2 - 1) * (2 + q * 24 + stress * 4) + Math.sin(T * 40) * q * 10);
      trace.setAttribute('d', pathOf(tbuf.map((v, i) => [28 + i * 4, 49 + clamp(v, -20, 20)])));
    }
    // The room.
    roomK = lerp(roomK, roomOn ? 1 : 0, 1 - Math.exp(-ad * 6));
    room.style.display = roomK > 0.02 ? '' : 'none';
    if (roomK <= 0.02) return;
    rq = Math.max(0, rq - ad * 0.36);
    danger = Math.max(0, danger - ad * 0.2);
    room.setAttribute('opacity', roomK.toFixed(2));
    mv(room, RX0 + Math.sin(T * 47) * 7 * rq, RY0 + Math.cos(T * 41) * 4 * rq);
    kidX += clamp(kidTX - kidX, -200 * ad, 200 * ad);
    const there = Math.abs(kidTX - kidX) < 0.5, under = there && kidTX === 262;
    A(kidG, { transform: `translate(${f1(kidX)} 229) rotate(${there ? 0 : f1(Math.sin(T * 14) * 6)}) scale(1.5 ${under ? 1.05 : 1.5})` });
    cracks.setAttribute('opacity', broken ? 1 : 0);
    if (rq > 0.3) {
      for (const b of books) if (b.st === 0 && Math.random() < ad * 3) { b.st = 1; b.vx = rnd(-30, 30); b.vr = rnd(-300, 300); }
      if (fr.st === 0 && Math.random() < ad * 2) fr.st = 1;
      if (!broken && Math.random() < ad * 1.2) {
        broken = true;
        for (let i = 0; i < 12; i++) shards.spawn((p) => { p.x = rnd(40, 120); p.y = rnd(60, 160); p.vx = rnd(30, 140); p.vy = rnd(-60, 20); p.r = rnd(0, 360); });
      }
    }
    for (const b of books) {
      if (b.st === 0) { b.x = b.hx + (rq > 0 ? Math.sin(T * 30 + b.hx) * 1.5 * rq : 0); b.y = b.hy; b.r = 0; }
      else if (b.st === 1) {
        b.vy += 900 * ad; b.x += b.vx * ad; b.y += b.vy * ad; b.r += b.vr * ad;
        if (b.y > 224) { b.y = 224; b.st = 2; b.r = 90; }
      }
      A(b.e, { transform: `translate(${f1(b.x)} ${f1(b.y)}) rotate(${f1(b.r)})` });
    }
    if (fr.st === 1) {
      fr.vy += 900 * ad; fr.y += fr.vy * ad; fr.r += 120 * ad;
      if (fr.y > 144) { fr.y = 144; fr.vy = -fr.vy * 0.3; fr.r = 8; if (Math.abs(fr.vy) < 60) fr.st = 2; }
    }
    mv(frame, 262, fr.y, fr.r, 1);
    shards.step(ad, (p, d) => {
      p.vy += 500 * d; p.x += p.vx * d; p.y += p.vy * d; p.r += 400 * d;
      if (p.y > 228) { p.y = 228; p.vx *= 0.3; p.vy = 0; }
      if (p.age > 3) return false;
      mv(p.el, p.x, p.y, p.r, 1.4);
    });
    if (there && rq > 0.2 && kidTX !== 262) danger = 1;
    A(kidRing, { cx: f1(kidX), cy: 182, r: f1(30 + Math.sin(T * 9) * 4), opacity: (Math.min(1, danger * 3) * (0.6 + 0.4 * Math.sin(T * 10))).toFixed(2) });
  };
  const quake = (x, y) => {
    ex = clamp(x, 40, w - 40); ey = clamp(y, 200, h - 30);
    q = 1; slip = 1;
    for (let i = 0; i < 3; i++) rings.spawn((p) => { p.age = -i * 0.3; });
  };
  s.tap = (x, y) => { quake(x, y); s.wake = 6; };
  const tidy = () => {
    rq = 0; danger = 0; broken = false; kidX = kidTX = 150;
    for (const b of books) { b.st = 0; b.x = b.hx; b.y = b.hy; b.r = 0; }
    fr.st = 0; fr.y = 104; fr.vy = 0; fr.r = 0;
    shards.clear();
  };
  s.steps = [
    {
      need: 3,
      enter: () => { roomOn = false; stressTo = 0; },
      act: (k, x, y, n) => {
        stressTo = n / 3;
        q = Math.max(q, 0.12);
        if (n >= 3) after(s, 0.7, () => { stressTo = 0; stress = 0; bv = -45; quake(556, 236); });
      },
      wait: 2.6,
    },
    { enter: () => { roomOn = false; stressTo = 0; }, act: (k, x, y) => quake(x, y), wait: 2.6 },
    {
      pick: ['run', 'window', 'table'], safe: ['table'], cardAt: [540, 96],
      enter: () => { roomOn = true; tidy(); },
      act: (k) => {
        kidTX = k === 'run' ? 442 : k === 'window' ? 86 : 262;
        after(s, 1.1, () => { rq = 2.6; quake(556, 300); });
      },
      wait: 3.8,
    },
  ];
  s.free = () => { roomOn = false; };
  s.update(0, 0);
});

// --------------------------------------------------------- camera and input
const labelsEl = document.getElementById('labels');
const sheet = document.getElementById('sheet');
const introEl = document.getElementById('intro');
const cardEl = document.getElementById('s-card');
const sayEl = document.getElementById('s-say');
const doEl = document.getElementById('s-do');
const dotsEl = document.getElementById('s-dots');
const cam = { cx: 600, cy: 966, s: 0.3 };
let tw = null;
let current = null;
let W = 0, H = 0;

spots.forEach((sp) => {
  const l = document.createElement('div');
  l.className = 'label';
  labelsEl.appendChild(l);
  sp.label = l;
});

function frameFor(box, avail, pad) {
  const sc = Math.min(avail.w / box[2], avail.h / box[3]) * pad;
  return {
    s: sc,
    cx: box[0] + box[2] / 2 - (avail.x + avail.w / 2 - W / 2) / sc,
    cy: box[1] + box[3] / 2 - (avail.y + avail.h / 2 - H / 2) / sc,
  };
}

function availRect(zoomed) {
  const top = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sa-top')) || 0);
  const topPad = top + 62;
  if (!zoomed) return { x: 0, y: topPad, w: W, h: Math.max(100, H - topPad - 52) };
  if (W > H) return { x: 0, y: topPad - 10, w: Math.max(100, W - sheet.offsetWidth), h: H - topPad };
  return { x: 0, y: topPad, w: W, h: Math.max(100, H - sheet.offsetHeight - topPad - 4) };
}

function target() {
  return current ? frameFor(current.zoom, availRect(true), 0.94) : frameFor([0, 0, WORLD.w, WORLD.h], availRect(false), 1);
}

function applyCam() {
  const vw = W / cam.s, vh = H / cam.s;
  svg.setAttribute('viewBox', `${f1(cam.cx - vw / 2)} ${f1(cam.cy - vh / 2)} ${f1(vw)} ${f1(vh)}`);
  for (const sp of spots) {
    const sx = (sp.x + sp.w / 2 - cam.cx) * cam.s + W / 2;
    const sy = (sp.y + 8 - cam.cy) * cam.s + H / 2;
    sp.label.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) translateX(-50%)`;
    sp.label.style.maxWidth = Math.max(60, sp.w * cam.s - 8) + 'px';
  }
}

function flyTo(dur) {
  const t = target();
  if (dur <= 0) { Object.assign(cam, t); tw = null; applyCam(); return; }
  tw = { from: { ...cam }, to: t, t: 0, dur };
}

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  flyTo(0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

// In portrait the tile is framed above the sheet, so when the sheet's height
// changes (a longer explanation, more buttons) the camera follows it.
let sheetH = 0;
if ('ResizeObserver' in window) {
  new ResizeObserver(() => {
    const hh = sheet.offsetHeight;
    if (Math.abs(hh - sheetH) < 12) return;
    sheetH = hh;
    if (!current) return;
    if (tw) tw.to = target(); else flyTo(0.35);
  }).observe(sheet);
}

// ------------------------------------------------------------------ stories
const said = (v, k) => (v && typeof v === 'object' ? v[k] : v);

function enterStep(sp, i, keepTried) {
  cancelTimers(sp);
  const tried = keepTried && sp.st && sp.st.i === i ? sp.st.tried : {};
  sp.st = { i, ph: 'ask', n: 0, out: null, t: 0, tried };
  sp.card.hide();
  const step = sp.steps[i];
  if (step.enter) step.enter();
  sp.wake = Math.max(sp.wake, 3);
}

function goFree(sp) {
  cancelTimers(sp);
  sp.st = { i: sp.steps.length, ph: 'free', n: 0, out: null, t: 0, tried: {} };
  sp.card.hide();
  if (sp.free) sp.free();
  sp.wake = Math.max(sp.wake, 3);
}

function act(sp, k, x, y) {
  const S = sp.st, step = sp.steps[S.i];
  if (step.need) {
    S.n++;
    const r = step.act(k, x, y, S.n);
    sp.wake = Math.max(sp.wake, 5);
    if (S.n < step.need) { render(); return; }
    S.out = r;
  } else {
    S.out = step.act(k, x, y, 1);
  }
  if (step.pick) {
    S.tried[k] = true;
    if (step.safe) sp.card.show(TXT[sp.id][lang].s[S.i].pick[k].split(' ')[0], step.cardAt || [76, 66]);
  }
  if (S.out == null) S.out = k;
  S.ph = 'now';
  S.t = step.wait || 2.5;
  sp.wake = Math.max(sp.wake, S.t + 4);
  render();
}

function reveal(sp) {
  const S = sp.st, step = sp.steps[S.i];
  S.ph = 'done';
  if (step.pick && step.safe) sp.card.verdict(step.safe.includes(S.out));
  render();
}

function button(label, cls, fn) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener('click', fn);
  doEl.appendChild(b);
  return b;
}

function render() {
  if (!current) return;
  const sp = current, S = sp.st, T = TXT[sp.id], L = T[lang], u = UI[lang];
  document.getElementById('s-emoji').textContent = T.e;
  document.getElementById('s-name').textContent = L.name;
  document.getElementById('s-title').textContent = L.q;
  sheet.style.setProperty('--accent', sp.accent);
  dotsEl.textContent = '';
  for (let i = 0; i < sp.steps.length; i++) {
    const d = document.createElement('i');
    if (i < S.i || (i === S.i && S.ph === 'done')) d.className = 'done';
    else if (i === S.i) d.className = 'on';
    dotsEl.appendChild(d);
  }
  cardEl.dataset.ph = S.ph;
  document.getElementById('s-phase').textContent = u.ph[S.ph];
  doEl.textContent = '';
  if (S.ph === 'free') {
    sayEl.textContent = u.freeDone + ' ' + L.free;
    button(u.restart, 'alt', () => { enterStep(sp, 0); render(); });
    return;
  }
  const step = sp.steps[S.i], tx = L.s[S.i];
  if (S.ph === 'ask') {
    sayEl.textContent = S.n > 0 && tx.more ? tx.more.replace('{n}', step.need - S.n) : tx.ask;
    if (step.pick) for (const k of step.pick) button(tx.pick[k], null, () => act(sp, k));
    else {
      const d = document.createElement('div');
      d.className = 'hint';
      d.textContent = '👆 ' + tx.do;
      doEl.appendChild(d);
    }
  } else if (S.ph === 'now') {
    sayEl.textContent = said(tx.now, S.out);
    const d = document.createElement('div');
    d.className = 'wait';
    d.innerHTML = '<span>•</span><span>•</span><span>•</span>';
    doEl.appendChild(d);
  } else {
    sayEl.textContent = said(tx.done, S.out);
    // Offer the other choices, so "this happened" can be set against "that".
    if (step.pick) {
      for (const k of step.pick) {
        if (S.tried[k]) continue;
        button(`${u.try}: ${tx.pick[k]}`, 'alt', () => { enterStep(sp, S.i, true); act(sp, k); });
      }
    } else button(u.again, 'alt', () => { enterStep(sp, S.i); render(); });
    const last = S.i === sp.steps.length - 1;
    button(last ? u.finish : u.go, 'go', () => { if (last) goFree(sp); else enterStep(sp, S.i + 1); render(); });
  }
}

function nudge() {
  doEl.classList.remove('nudge');
  void doEl.offsetWidth;
  doEl.classList.add('nudge');
}

function tileTap(sp, x, y) {
  const S = sp.st;
  if (S.ph === 'free') { sp.tap(x, y); return; }
  const step = sp.steps[S.i];
  if (S.ph === 'ask' && !step.pick) act(sp, undefined, x, y);
  else if (S.ph !== 'now') nudge();
}

function setText() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.title = u.title;
  document.getElementById('intro-text').textContent = u.intro;
  document.getElementById('b-map-t').textContent = u.map;
  document.getElementById('b-prev').setAttribute('aria-label', u.prev);
  document.getElementById('b-next').setAttribute('aria-label', u.next);
  for (const sp of spots) sp.label.textContent = TXT[sp.id].e + ' ' + TXT[sp.id][lang].name;
  document.querySelectorAll('#langs button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  render();
}

function openSpot(sp) {
  current = sp;
  if (!sp.st) enterStep(sp, 0);
  sp.wake = Math.max(sp.wake, 2);
  render();
  sheet.classList.add('open');
  labelsEl.classList.add('hide');
  introEl.classList.add('hide');
  sheetH = sheet.offsetHeight;
  flyTo(0.8);
  try { history.replaceState(null, '', '#' + sp.id); } catch (e) {}
}

function closeSpot() {
  if (!current) return;
  current = null;
  sheet.classList.remove('open');
  labelsEl.classList.remove('hide');
  introEl.classList.remove('hide');
  flyTo(0.8);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}

function step(dir) {
  if (!current) return;
  const i = (spots.indexOf(current) + dir + spots.length) % spots.length;
  openSpot(spots[i]);
}

document.getElementById('b-map').addEventListener('click', closeSpot);
document.getElementById('b-prev').addEventListener('click', () => step(-1));
document.getElementById('b-next').addEventListener('click', () => step(1));
document.getElementById('langs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('earth-lang', lang); } catch (err) {}
  setText();
  if (current) flyTo(0);
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSpot();
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});

svg.addEventListener('pointerdown', (e) => {
  const vw = W / cam.s, vh = H / cam.s;
  const wx = cam.cx - vw / 2 + (e.clientX / W) * vw;
  const wy = cam.cy - vh / 2 + (e.clientY / H) * vh;
  const hit = spots.find((sp) => wx >= sp.x && wx <= sp.x + sp.w && wy >= sp.y && wy <= sp.y + sp.h);
  if (!hit) return;
  if (!current) openSpot(hit);
  else if (hit === current && !tw) tileTap(hit, wx - hit.x, wy - hit.y);
});

// --------------------------------------------------------------- main loop
let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  if (document.hidden) return;
  if (tw) {
    tw.t += dt;
    const u = ease(Math.min(1, tw.t / tw.dur));
    cam.s = tw.from.s * Math.pow(tw.to.s / tw.from.s, u);
    cam.cx = lerp(tw.from.cx, tw.to.cx, u);
    cam.cy = lerp(tw.from.cy, tw.to.cy, u);
    if (tw.t >= tw.dur) tw = null;
    applyCam();
  }
  for (let i = timers.length - 1; i >= 0; i--) {
    const k = timers[i];
    k.t -= dt;
    if (k.t <= 0) { timers.splice(i, 1); k.fn(); }
  }
  if (current) {
    current.card.step(dt);
    const S = current.st;
    if (S.ph === 'now') { S.t -= dt; if (S.t <= 0) reveal(current); }
  }
  // Tiles off-screen aren't worth animating. While zoomed, the neighbours
  // stay paused; the one you're looking at is the only one that moves.
  const vw = W / cam.s, vh = H / cam.s;
  const vx = cam.cx - vw / 2, vy = cam.cy - vh / 2;
  for (const sp of spots) {
    if (current && sp !== current && !tw) continue;
    if (sp.x > vx + vw || sp.x + sp.w < vx || sp.y > vy + vh || sp.y + sp.h < vy) continue;
    const ad = !REDUCED || sp.wake > 0 ? dt : 0;
    sp.wake = Math.max(0, sp.wake - dt);
    sp.T += ad;
    if (ad > 0) sp.update(dt, ad);
  }
}

// Let each tile settle for a few seconds before the player sees it, so the
// smoke, rain and drifting things are already in progress. Under reduced
// motion this is also what the still picture is made of.
for (const sp of spots) { for (let i = 0; i < 60; i++) { sp.T += 0.05; sp.update(0.05, 0.05); } }

resize();
setText();
applyCam();
const startId = (location.hash || '').slice(1);
const startSpot = spots.find((sp) => sp.id === startId);
if (startSpot) { openSpot(startSpot); flyTo(0); }
requestAnimationFrame(loop);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then((reg) => {
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update();
    });
  });
}
})();
</script>
</body>
</html>
