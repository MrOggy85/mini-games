<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/games/glide/manifest.json">
<link rel="icon" href="/games/glide/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/games/glide/apple-touch-icon.png">
<title>Glide</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  overflow: hidden;
  height: 100%;
  touch-action: none;
}

body {
  height: 100%;
  background: #0a0a0a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 16px 32px;
  color: #ccc;
  overflow: hidden;
}

.back-link {
  align-self: flex-start;
  color: #8a8a8a;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  transition: color 0.15s;
  margin-bottom: 8px;
}
.back-link:hover { color: #4af; }

h1 {
  font-size: clamp(1.6rem, 6.5vw, 2.6rem);
  font-weight: 800;
  color: #4af;
  text-shadow: 0 0 10px #4af, 0 0 24px #06f;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 4px;
  text-align: center;
}

.tagline {
  font-size: 0.76rem;
  color: #7b7b7b;
  text-align: center;
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}

.info-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.82rem;
  font-weight: 600;
  color: #a8a8a8;
  flex-wrap: wrap;
  justify-content: center;
}

.pill {
  background: rgba(255,255,255,0.06);
  border: 1px solid #3a3a3a;
  padding: 4px 14px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}

/* Soft pool of light under the board so the 3D scene doesn't float on pure
   black — also lifts the board's outer rim clear of the page background. */
#stage {
  position: relative;
  border-radius: 18px;
}
#stage::before {
  content: '';
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 55%, rgba(80,110,190,0.18), rgba(0,0,0,0) 70%);
  pointer-events: none;
}
#scene {
  display: block;
  position: relative;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

#loadErr {
  display: none;
  max-width: 22rem;
  margin: 40px 0;
  text-align: center;
  font-size: 0.9rem;
  line-height: 1.5;
  color: #d88;
}
#loadErr.on { display: block; }

.btns {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  padding: 11px 26px;
  font-size: 0.86rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
  min-width: 100px;
}
.btn:active { transform: scale(0.94); }

.btn-reset {
  background: rgba(255,255,255,0.09);
  color: #c4c4c4;
  border: 1px solid #4a4a4a;
}
.btn-reset:hover { color: #fff; border-color: #777; }

.btn-hint {
  background: linear-gradient(135deg, #f80 0%, #c50 100%);
  color: #fff;
  box-shadow: 0 2px 10px rgba(255,136,0,0.3);
}
.btn-hint:hover { opacity: 0.9; }

.toast {
  position: fixed;
  bottom: 18%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(220,50,50,0.92);
  color: #fff;
  padding: 9px 22px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 700;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

#winOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#winOverlay.on { display: flex; }

.win-star {
  font-size: clamp(2.5rem, 12vw, 4.5rem);
  line-height: 1;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
.win-title {
  font-size: clamp(1.8rem, 7vw, 3rem);
  font-weight: 800;
  color: #4af;
  text-shadow: 0 0 20px #4af;
  animation: pop 0.5s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
}
.win-sub {
  font-size: 0.95rem;
  color: #a0a0a0;
  text-align: center;
  padding: 0 20px;
  animation: pop 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
}
.btn-next {
  background: linear-gradient(135deg, #4af 0%, #06f 100%);
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,100,255,0.4);
  padding: 13px 44px;
  font-size: 1rem;
  animation: pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
.btn-next:hover { opacity: 0.9; }

@keyframes pop {
  from { opacity: 0; transform: scale(0.4); }
  to   { opacity: 1; transform: scale(1); }
}

.confetti-p {
  position: fixed;
  top: -20px;
  pointer-events: none;
  z-index: 200;
  animation: cfall linear forwards;
}
@keyframes cfall {
  to { transform: translateY(110vh) rotate(var(--spin)); opacity: 0; }
}
</style>
</head>
<body>

<a href="/" class="back-link">&larr; All Games</a>
<h1>Glide</h1>
<p class="tagline">Tap a block — it slides until it exits or stops. Clear the board.</p>

<div class="info-bar">
  <span class="pill" id="lvlPill">Level 1</span>
  <span class="pill" id="tapPill">Tries: 0</span>
  <span class="pill" id="blkPill">Blocks: 0</span>
</div>

<div id="stage">
  <canvas id="scene"></canvas>
</div>

<p id="loadErr">Couldn&rsquo;t load the 3D engine. Reload the page &mdash; if you&rsquo;re offline, open the game once while connected so it can be cached.</p>

<div class="btns">
  <button class="btn btn-reset" id="btnReset">&#8635; Reset</button>
  <button class="btn btn-hint" id="btnHint">&#128161; Hint</button>
</div>

<div class="toast" id="toast"></div>

<div id="winOverlay">
  <div class="win-star">&#10024;</div>
  <div class="win-title">Cleared!</div>
  <div class="win-sub" id="winSub"></div>
  <button class="btn btn-next" id="btnNext">Next Level &#8594;</button>
</div>

<script type="module">
import * as THREE from '/vendor/three.module.min.js';

// ── Juice Toolkit (copy-pasted subset, see /templates/juice.js) ─────────────

function juiceBurst(x, y, colors, opts) {
  opts = opts || {};
  var count = opts.count || 14;
  var spread = opts.spread || 70;
  var duration = opts.duration || 500;
  for (var i = 0; i < count; i++) {
    var el = document.createElement('div');
    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    var dist = spread * (0.5 + Math.random() * 0.5);
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist;
    var size = 4 + Math.random() * 4;
    el.style.cssText =
      'position:fixed;left:' + x + 'px;top:' + y + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
      'background:' + colors[i % colors.length] + ';' +
      'pointer-events:none;z-index:999;';
    document.body.appendChild(el);
    (function(particle, tx, ty) {
      particle.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(0.3)', opacity: 0 }
      ], { duration: duration, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = function() {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      };
    }(el, dx, dy));
  }
}

// ── Board constants (world units, 1 unit = 1 cell) ───────────────────────────

const G = 7;
const GAP = 0.09;
const STEP = 1 + GAP;
const PAD = 0.3;
const BOARD_W = G + (G - 1) * GAP + 2 * PAD;
const SLAB_H = 0.42;
const TILE_H = 0.14;
const BLOCK_W = 0.90;
const BLOCK_H = 0.62;
const BLOCK_Y = TILE_H;                 // block base sits on the tile top
const PITCH = THREE.MathUtils.degToRad(51);
const TARGET = new THREE.Vector3(0, 0.3, 0);

const DIRS = [
  { dr: -1, dc:  0, yaw: 0 },
  { dr:  0, dc:  1, yaw: -Math.PI / 2 },
  { dr:  1, dc:  0, yaw: Math.PI },
  { dr:  0, dc: -1, yaw: Math.PI / 2 }
];

// Okabe-Ito colorblind-safe palette (distinguishable under protanopia,
// deuteranopia and tritanopia). `a` is the lit body colour, `b` the DOM
// particle accent.
const COLORS = [
  { a: 0xffb733, b: '#cc7a00', css: '#ffb733' },  // orange
  { a: 0x7ec8f3, b: '#2d8fc4', css: '#7ec8f3' },  // sky blue
  { a: 0x33c79a, b: '#007a56', css: '#33c79a' },  // bluish green
  { a: 0x3d94d6, b: '#00517d', css: '#3d94d6' },  // blue
  { a: 0xff8a4d, b: '#a84500', css: '#ff8a4d' },  // vermillion
  { a: 0xe0a0c4, b: '#a84e76', css: '#e0a0c4' }   // reddish purple
];

// Board neutrals are deliberately light: at ~3:1+ against the near-black page
// they stay readable on a dimmed tablet outdoors (see CLAUDE.md).
const SLAB_COLOR = 0x5e6a8c;
const TILE_COLOR = 0x78849f;

// ── Renderer / scene ─────────────────────────────────────────────────────────

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 1, 200);
const camBase = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0x93a8dd, 0x0e1018, 0.38));

const keyLight = new THREE.DirectionalLight(0xfff4e2, 0.72);
keyLight.position.set(-6.5, 15, 4.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -6.5;
keyLight.shadow.camera.right = 6.5;
keyLight.shadow.camera.top = 6.5;
keyLight.shadow.camera.bottom = -6.5;
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 34;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.16);
fillLight.position.set(7, 5, -8);
scene.add(fillLight);

// ── Geometry helpers ─────────────────────────────────────────────────────────

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Beveled box with its base at y=0. ExtrudeGeometry spans [-bevel, depth+bevel]
// on its extrusion axis, so inset the profile by `bevel` and lift by `bevel`.
function roundedBox(w, d, h, r, bevel) {
  const geo = new THREE.ExtrudeGeometry(
    roundedRect(w - 2 * bevel, d - 2 * bevel, Math.max(0.01, r - bevel)),
    {
      depth: h - 2 * bevel,
      bevelEnabled: true,
      bevelThickness: bevel,
      bevelSize: bevel,
      bevelSegments: 2,
      curveSegments: 5
    }
  );
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, bevel, 0);
  return geo;
}

// Flat arrow pointing at -Z (screen "up"), lying in the XZ plane, base at y=0.
function arrowGeometry() {
  const s = new THREE.Shape();
  const w = 0.10, hw = 0.26, tip = 0.30, neck = 0.02, tail = -0.28;
  s.moveTo(0, tip);
  s.lineTo(-hw, neck);
  s.lineTo(-w, neck);
  s.lineTo(-w, tail);
  s.lineTo(w, tail);
  s.lineTo(w, neck);
  s.lineTo(hw, neck);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.018, bevelSize: 0.018, bevelSegments: 1
  });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0.018, 0);
  return geo;
}

const TILE_GEO = roundedBox(1, 1, TILE_H, 0.2, 0.035);
const BLOCK_GEO = roundedBox(BLOCK_W, BLOCK_W, BLOCK_H, 0.17, 0.05);
const ARROW_GEO = arrowGeometry();
// Oversized invisible collider so tapping near a block still registers on a phone.
const HIT_GEO = new THREE.BoxGeometry(STEP * 1.02, BLOCK_H + 0.5, STEP * 1.02);
const HIT_MAT = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false });

// ── Static board ─────────────────────────────────────────────────────────────

const slab = new THREE.Mesh(
  roundedBox(BOARD_W, BOARD_W, SLAB_H, 0.34, 0.06),
  new THREE.MeshStandardMaterial({ color: SLAB_COLOR, roughness: 0.9, metalness: 0.02 })
);
slab.position.y = -SLAB_H;
slab.receiveShadow = true;
scene.add(slab);

const tiles = new THREE.InstancedMesh(
  TILE_GEO,
  new THREE.MeshStandardMaterial({ color: TILE_COLOR, roughness: 0.82, metalness: 0.02 }),
  G * G
);
tiles.receiveShadow = true;
tiles.castShadow = true;
{
  const m = new THREE.Object3D();
  for (let r = 0, i = 0; r < G; r++) {
    for (let c = 0; c < G; c++, i++) {
      m.position.set(cellX(c), 0, cellZ(r));
      m.updateMatrix();
      tiles.setMatrixAt(i, m.matrix);
    }
  }
  tiles.instanceMatrix.needsUpdate = true;
}
scene.add(tiles);

const blockGroup = new THREE.Group();
scene.add(blockGroup);

function cellX(c) { return (c - (G - 1) / 2) * STEP; }
function cellZ(r) { return (r - (G - 1) / 2) * STEP; }

// ── Layout ───────────────────────────────────────────────────────────────────

// Screen-space half-extents of the board once tilted, used to size the canvas
// and to solve for a camera distance that always frames the whole board.
function boardHalfExtents() {
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  const hw = BOARD_W / 2;
  const ys = [-SLAB_H, BLOCK_Y + BLOCK_H + 0.25];
  let hx = 0, hy = 0;
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      for (const y of ys) {
        const vx = sx * hw, vz = sz * hw, vy = y - TARGET.y;
        hx = Math.max(hx, Math.abs(vx));
        hy = Math.max(hy, Math.abs(vy * cp - vz * sp));
      }
    }
  }
  return { hx, hy };
}

const HALF = boardHalfExtents();
const ASPECT = HALF.hx / HALF.hy;

function layout() {
  let w = Math.min(window.innerWidth - 24, 520);
  const maxH = Math.max(190, window.innerHeight - 290);
  let h = w / ASPECT;
  if (h > maxH) { h = maxH; w = h * ASPECT; }

  renderer.setSize(w, h);
  camera.aspect = w / h;

  const tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const dist = Math.max(HALF.hy / tanY, HALF.hx / (tanY * camera.aspect)) * 1.06;
  camBase.set(0, TARGET.y + Math.sin(PITCH) * dist, Math.cos(PITCH) * dist);
  camera.near = Math.max(0.5, dist - 14);
  camera.far = dist + 14;
  camera.position.copy(camBase);
  camera.lookAt(TARGET);
  camera.updateProjectionMatrix();
}

// ── Tweens / shake ───────────────────────────────────────────────────────────

const tweens = [];
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

function tween(dur, onUpdate, onDone, ease) {
  tweens.push({ t0: performance.now(), dur, up: onUpdate, done: onDone, ease: ease || easeOut });
}

function stepTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    let p = (now - t.t0) / t.dur;
    if (p >= 1) p = 1;
    t.up(t.ease(p), p);
    if (p === 1) { tweens.splice(i, 1); if (t.done) t.done(); }
  }
}

let shakeAmt = 0;
const shakeOff = new THREE.Vector3();

function shake(a) { shakeAmt = Math.max(shakeAmt, a); }

// ── Game state ───────────────────────────────────────────────────────────────

let uid = 0;
const game = { lvl: 1, taps: 0, minTaps: 0, maxTaps: 5, blocks: [], init: [], busy: false };
const meshById = new Map();
let hintId = -1, hintUntil = 0;

// ── BFS solver ───────────────────────────────────────────────────────────────

function stateKey(bs) {
  return bs.map((b) => b.r + ',' + b.c + ',' + b.d).sort().join('|');
}

function applySlide(bs, id) {
  const a = bs.map((b) => ({ id: b.id, r: b.r, c: b.c, d: b.d }));
  let i = 0;
  for (; i < a.length; i++) if (a[i].id === id) break;
  if (i === a.length) return null;
  const b = a[i], dir = DIRS[b.d];
  for (;;) {
    const nr = b.r + dir.dr, nc = b.c + dir.dc;
    if (nr < 0 || nr >= G || nc < 0 || nc >= G) { a.splice(i, 1); return a; }
    let hit = false;
    for (let j = 0; j < a.length; j++) {
      if (j !== i && a[j].r === nr && a[j].c === nc) { hit = true; break; }
    }
    if (hit) return a;
    b.r = nr; b.c = nc;
  }
}

function solve(bs, lim) {
  const visited = Object.create(null);
  const q = [{ bs, path: [] }];
  visited[stateKey(bs)] = 1;
  let n = 0;
  const limit = lim || 60000;
  while (q.length) {
    const { bs: cur, path } = q.shift();
    if (!cur.length) return path;
    if (++n >= limit) return null;
    for (let i = 0; i < cur.length; i++) {
      const nxt = applySlide(cur, cur[i].id);
      if (!nxt) continue;
      const k = stateKey(nxt);
      if (!visited[k]) {
        visited[k] = 1;
        q.push({ bs: nxt, path: path.concat(cur[i].id) });
      }
    }
  }
  return null;
}

// ── Level generation ─────────────────────────────────────────────────────────

function numBlocks(lvl) {
  if (lvl <= 2)  return 3;
  if (lvl <= 5)  return 4;
  if (lvl <= 9)  return 5;
  if (lvl <= 14) return 6;
  return 7;
}

function biasedPos() {
  return Math.min(G - 1, Math.max(0, Math.floor((Math.random() + Math.random() + Math.random()) * G / 3)));
}

function inwardDir(r, c) {
  const cr = (G - 1) / 2, cc = (G - 1) / 2;
  const dr = cr - r, dc = cc - c;
  if (dr === 0 && dc === 0) return -1;
  return Math.abs(dr) >= Math.abs(dc) ? (dr > 0 ? 2 : 0) : (dc > 0 ? 1 : 3);
}

function randBlocks(n) {
  const used = Object.create(null), bs = [];
  for (let i = 0; i < n; i++) {
    let r, c, t = 0;
    do {
      r = biasedPos();
      c = biasedPos();
    } while (used[r + ',' + c] && ++t < 40);
    if (t >= 40) return null;
    used[r + ',' + c] = 1;
    const pref = inwardDir(r, c);
    const d = (pref >= 0 && Math.random() < 0.65) ? pref : Math.floor(Math.random() * 4);
    bs.push({ id: uid++, r, c, d, ci: i % COLORS.length });
  }
  return bs;
}

function genLevel(lvl) {
  const n = numBlocks(lvl);
  const tapLimit = n + 2;
  let bs, sol;
  for (let a = 0; a < 200; a++) {
    bs = randBlocks(n);
    if (!bs) continue;
    sol = solve(bs, 40000);
    if (sol && sol.length <= tapLimit) return { bs, min: sol.length, maxTaps: tapLimit };
  }
  // Fallback: accept any solvable level, give min+2 tries
  for (let a = 0; a < 100; a++) {
    bs = randBlocks(n);
    if (!bs) continue;
    sol = solve(bs, 40000);
    if (sol) return { bs, min: sol.length, maxTaps: sol.length + 2 };
  }
  // Hard fallback
  return {
    bs: [
      { id: uid++, r: 0, c: 1, d: 0, ci: 0 },
      { id: uid++, r: 2, c: 0, d: 3, ci: 1 },
      { id: uid++, r: 4, c: 3, d: 2, ci: 2 }
    ],
    min: 3,
    maxTaps: 5
  };
}

// ── Block meshes ─────────────────────────────────────────────────────────────

function makeBlock(b) {
  const col = COLORS[b.ci];
  const mat = new THREE.MeshStandardMaterial({
    color: col.a,
    roughness: 0.34,
    metalness: 0.06,
    emissive: col.a,
    emissiveIntensity: 0.1
  });
  const mesh = new THREE.Mesh(BLOCK_GEO, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(cellX(b.c), BLOCK_Y, cellZ(b.r));

  // Dark, not white: every block colour in the palette is light, so a charcoal
  // arrow reads on all six (the 2D version needed a black text outline for this).
  const arrow = new THREE.Mesh(ARROW_GEO, new THREE.MeshStandardMaterial({
    color: 0x15171f, roughness: 0.55, metalness: 0.0
  }));
  arrow.position.y = BLOCK_H;
  arrow.rotation.y = DIRS[b.d].yaw;
  arrow.castShadow = true;
  mesh.add(arrow);

  const hit = new THREE.Mesh(HIT_GEO, HIT_MAT);
  hit.position.y = BLOCK_H / 2;
  hit.userData.blockId = b.id;
  mesh.add(hit);

  mesh.userData = { id: b.id, phase: Math.random() * Math.PI * 2, arrow, mat };
  blockGroup.add(mesh);
  meshById.set(b.id, mesh);
  return mesh;
}

function clearBlocks() {
  for (const mesh of meshById.values()) {
    mesh.userData.mat.dispose();
    mesh.userData.arrow.material.dispose();
  }
  blockGroup.clear();
  meshById.clear();
  tweens.length = 0;
}

function dropBlock(id) {
  const mesh = meshById.get(id);
  if (!mesh) return;
  mesh.userData.mat.dispose();
  mesh.userData.arrow.material.dispose();
  blockGroup.remove(mesh);
  meshById.delete(id);
}

function buildBlocks() {
  clearBlocks();
  game.blocks.forEach(makeBlock);
}

function toScreen(v) {
  const p = v.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return {
    x: rect.left + (p.x * 0.5 + 0.5) * rect.width,
    y: rect.top + (-p.y * 0.5 + 0.5) * rect.height
  };
}

// ── HUD ──────────────────────────────────────────────────────────────────────

function updateHUD() {
  document.getElementById('lvlPill').textContent = 'Level ' + game.lvl;
  document.getElementById('tapPill').textContent = 'Tries: ' + game.taps + ' / ' + game.maxTaps;
  document.getElementById('blkPill').textContent = 'Blocks: ' + game.blocks.length;
}

// ── Game logic ───────────────────────────────────────────────────────────────

function initLevel(lvl) {
  game.lvl = lvl;
  game.taps = 0;
  game.busy = false;
  hintId = -1;
  document.getElementById('winOverlay').classList.remove('on');
  const data = genLevel(lvl);
  game.blocks = data.bs;
  game.minTaps = data.min;
  game.maxTaps = data.maxTaps;
  game.init = data.bs.map((b) => ({ id: b.id, r: b.r, c: b.c, d: b.d, ci: b.ci }));
  buildBlocks();
  updateHUD();
  // Staggered pop-in so a new level reads as "dealt" rather than snapping on.
  let i = 0;
  for (const mesh of meshById.values()) {
    const delay = i++ * 55;
    mesh.scale.setScalar(0.01);
    setTimeout(() => {
      if (meshById.get(mesh.userData.id) !== mesh) return;
      tween(280, (e) => {
        const s = 1 + Math.sin(e * Math.PI) * 0.12;
        mesh.scale.set(s, e * (2 - e) * s, s);
      }, () => mesh.scale.set(1, 1, 1));
    }, delay);
  }
}

function resetLevel() {
  game.blocks = game.init.map((b) => ({ id: b.id, r: b.r, c: b.c, d: b.d, ci: b.ci }));
  game.taps = 0;
  game.busy = false;
  hintId = -1;
  buildBlocks();
  updateHUD();
}

function doTap(id) {
  const idx = game.blocks.findIndex((b) => b.id === id);
  if (idx === -1) return;

  const b = game.blocks[idx], dir = DIRS[b.d];
  let r = b.r, c = b.c, exits = false;

  for (;;) {
    const nr = r + dir.dr, nc = c + dir.dc;
    if (nr < 0 || nr >= G || nc < 0 || nc >= G) { exits = true; break; }
    let hit = false;
    for (let j = 0; j < game.blocks.length; j++) {
      if (j !== idx && game.blocks[j].r === nr && game.blocks[j].c === nc) { hit = true; break; }
    }
    if (hit) break;
    r = nr; c = nc;
  }

  game.taps++;
  hintId = -1;

  const mesh = meshById.get(id);

  if (!exits && r === b.r && c === b.c) {
    playSound('stuck');
    updateHUD();
    if (mesh) {
      // Nudge into the blocked direction and bounce back, so it reads as
      // "tried to move and hit something" rather than "nothing happened".
      const ox = mesh.position.x, oz = mesh.position.z;
      tween(320, (e, p) => {
        const k = Math.sin(p * Math.PI * 3) * (1 - p) * 0.14;
        mesh.position.x = ox + dir.dc * k;
        mesh.position.z = oz + dir.dr * k;
      }, () => { mesh.position.x = ox; mesh.position.z = oz; }, (p) => p);
      shake(0.09);
    }
    if (game.taps >= game.maxTaps) {
      game.busy = true;
      playSound('fail');
      showToast('No tries left! Resetting…');
      setTimeout(resetLevel, 1300);
    }
    return;
  }

  game.busy = true;
  playSound('tap');

  if (!mesh) { finishTap(id, idx, r, c, exits); return; }

  const from = { x: cellX(b.c), z: cellZ(b.r) };
  const ar = exits ? r + dir.dr : r;
  const ac = exits ? c + dir.dc : c;
  const to = { x: cellX(ac), z: cellZ(ar) };
  const dist = Math.abs(ar - b.r) + Math.abs(ac - b.c);
  const dur = Math.min(360, 130 + dist * 42);

  if (exits) {
    mesh.userData.mat.transparent = true;
    mesh.userData.arrow.material.transparent = true;
  }

  tween(dur, (e, p) => {
    mesh.position.x = from.x + (to.x - from.x) * e;
    mesh.position.z = from.z + (to.z - from.z) * e;
    // Lean into the direction of travel, then straighten out.
    const lean = Math.sin(p * Math.PI) * 0.15;
    mesh.rotation.z = -lean * dir.dc;
    mesh.rotation.x = lean * dir.dr;
    if (exits) {
      const fade = Math.max(0, 1 - Math.max(0, p - 0.55) / 0.45);
      mesh.userData.mat.opacity = fade;
      mesh.userData.arrow.material.opacity = fade;
      mesh.scale.setScalar(0.4 + fade * 0.6);
    }
  }, () => {
    mesh.rotation.set(0, 0, 0);
    if (exits) {
      const s = toScreen(mesh.position.clone().setY(BLOCK_Y + BLOCK_H / 2));
      juiceBurst(s.x, s.y, [COLORS[b.ci].css, COLORS[b.ci].b]);
      shake(0.07);
      finishTap(id, idx, r, c, exits);
    } else {
      finishTap(id, idx, r, c, exits);
      // Squash & stretch on landing.
      tween(220, (e, p) => {
        const k = Math.sin(p * Math.PI);
        mesh.scale.set(1 + 0.16 * k, 1 - 0.26 * k, 1 + 0.16 * k);
      }, () => mesh.scale.set(1, 1, 1), (p) => p);
      shake(0.045);
    }
  });
}

function finishTap(id, idx, r, c, exits) {
  if (exits) {
    game.blocks.splice(idx, 1);
    dropBlock(id);
    playSound('exit');
  } else {
    game.blocks[idx].r = r;
    game.blocks[idx].c = c;
    const mesh = meshById.get(id);
    if (mesh) mesh.position.set(cellX(c), BLOCK_Y, cellZ(r));
  }
  updateHUD();
  game.busy = false;

  if (!game.blocks.length) {
    setTimeout(showWin, 150);
    return;
  }

  if (game.taps >= game.maxTaps) {
    game.busy = true;
    playSound('fail');
    showToast('No tries left! Resetting…');
    setTimeout(resetLevel, 1300);
    return;
  }

  const cur = game.blocks.map((b) => ({ id: b.id, r: b.r, c: b.c, d: b.d }));
  if (!solve(cur, 20000)) {
    game.busy = true;
    playSound('fail');
    showToast('Stuck! Resetting…');
    setTimeout(resetLevel, 1300);
  }
}

function showHint() {
  const cur = game.blocks.map((b) => ({ id: b.id, r: b.r, c: b.c, d: b.d }));
  const sol = solve(cur, 30000);
  if (!sol || !sol.length) return;
  hintId = sol[0];
  hintUntil = performance.now() + 1600;
}

function showWin() {
  playSound('win');
  let sub = 'Cleared in ' + game.taps + ' tap' + (game.taps !== 1 ? 's' : '') + '!';
  if (game.taps <= game.minTaps) sub += '  ✨ Perfect!';
  else sub += '  (min: ' + game.minTaps + ')';
  document.getElementById('winSub').textContent = sub;
  document.getElementById('winOverlay').classList.add('on');
  spawnConfetti();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

const CC = ['#FF6B6B','#4ECDC4','#FFB800','#A29BFE','#FD79A8','#45B7D1','#6C5CE7','#00B894'];
function spawnConfetti() {
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-p';
      const w = 6 + Math.random() * 8;
      const h = Math.random() < 0.5 ? w : w * (1.4 + Math.random() * 0.8);
      const dur = 1.8 + Math.random() * 2;
      el.style.cssText =
        'left:' + (Math.random() * 100) + 'vw;' +
        'width:' + w + 'px;height:' + h + 'px;' +
        'border-radius:' + (Math.random() < 0.5 ? '50%' : '2px') + ';' +
        'background:' + CC[Math.floor(Math.random() * CC.length)] + ';' +
        '--spin:' + (Math.random() * 720 - 360) + 'deg;' +
        'animation-duration:' + dur + 's;';
      document.body.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, (dur + 0.3) * 1000);
    }, i * 22);
  }
}

// ── Audio ────────────────────────────────────────────────────────────────────

let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return audioCtx;
}

function playSound(type) {
  const ctx = getAudio();
  if (!ctx) return;
  try {
    if (type === 'win') {
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.value = freq;
        const t = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        o.start(t); o.stop(t + 0.45);
      });
      return;
    }
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    if (type === 'tap') {
      osc.type = 'sine'; osc.frequency.value = 440;
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'exit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.22);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now); osc.stop(now + 0.28);
    } else if (type === 'stuck') {
      osc.type = 'square'; osc.frequency.value = 140;
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.4);
    }
  } catch (e) {}
}

// ── Input ────────────────────────────────────────────────────────────────────

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

canvas.addEventListener('pointerdown', (e) => {
  if (game.busy) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(blockGroup.children, true);
  for (const h of hits) {
    const id = h.object.userData.blockId;
    if (id !== undefined) { doTap(id); return; }
  }
});

document.getElementById('btnReset').addEventListener('click', () => { if (!game.busy) resetLevel(); });
document.getElementById('btnHint').addEventListener('click', () => { if (!game.busy) showHint(); });
document.getElementById('btnNext').addEventListener('click', () => initLevel(game.lvl + 1));
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
window.addEventListener('resize', layout);

// ── Render loop ──────────────────────────────────────────────────────────────

let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  stepTweens(now);

  const t = now / 1000;
  const hintOn = hintId !== -1 && now < hintUntil;
  for (const mesh of meshById.values()) {
    const u = mesh.userData;
    const isHint = hintOn && u.id === hintId;
    // Gentle idle float keeps the board feeling alive between taps.
    const bob = Math.sin(t * 1.5 + u.phase) * 0.018 + (isHint ? 0.09 + Math.sin(t * 9) * 0.05 : 0);
    mesh.position.y = BLOCK_Y + bob;
    u.mat.emissiveIntensity = isHint ? 0.28 + Math.sin(t * 9) * 0.22 : 0.1;
  }

  if (shakeAmt > 0.0005) {
    shakeOff.set((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt, 0)
      .applyQuaternion(camera.quaternion);
    camera.position.copy(camBase).add(shakeOff);
    shakeAmt *= Math.pow(0.0015, dt);
  } else if (shakeAmt !== 0) {
    shakeAmt = 0;
    camera.position.copy(camBase);
  }

  renderer.render(scene, camera);
}

// ── Init ─────────────────────────────────────────────────────────────────────

layout();
initLevel(20);
requestAnimationFrame(frame);
window.__glideReady = true;
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
// The board is drawn entirely by the module script above; if the engine fails
// to load the page would otherwise just sit blank.
setTimeout(function() {
  if (!window.__glideReady) {
    document.getElementById('stage').style.display = 'none';
    document.getElementById('loadErr').classList.add('on');
  }
}, 6000);
</script>
