<title>Trace</title>
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #09091a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.back-link {
  position: absolute;
  top: 14px;
  left: 16px;
  color: #8a8ab0;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  z-index: 10;
  transition: color 0.15s;
}
.back-link:hover { color: #4af; }

#top-bar {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 6px;
  flex-shrink: 0;
}
h1 {
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: #7ab8ff;
  text-shadow: 0 0 28px rgba(80,160,255,0.45);
}
#level-label {
  margin-top: 3px;
  font-size: 0.72rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #9a9ac0;
}
#hint-text {
  margin-top: 3px;
  font-size: 0.68rem;
  color: #8a8ab0;
  letter-spacing: 1px;
}

#canvas-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  position: relative;
}
/* Soft pool of light under the board so the 3D scene doesn't float on flat black. */
#canvas-wrap::before {
  content: '';
  position: absolute;
  top: 10%;
  left: 5%;
  width: 90%;
  height: 80%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 55%, rgba(80,110,190,0.16), rgba(0,0,0,0) 70%);
  pointer-events: none;
}
canvas {
  touch-action: none;
  cursor: crosshair;
  display: block;
  position: relative;
}

#load-err {
  display: none;
  max-width: 22rem;
  padding: 0 20px;
  text-align: center;
  font-size: 0.85rem;

  color: #d88;
}
#load-err.on { display: block; }

#btn-row {

  gap: 14px;

}
.btn {

}

#win-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;

  background: rgba(5,5,18,0.82);
  opacity: 0;

  z-index: 50;
}
#win-screen.show {
  opacity: 1;
  pointer-events: all;
}
#win-box {
  background: #0d0d22;
  border: 1px solid #253560;
  border-radius: 18px;
  padding: 44px 60px;
  text-align: center;

}

  text-shadow: 0 0 18px #44ff99;
}

  font-size: 1.25rem;

  text-transform: uppercase;
  margin-bottom: 22px;
}
#next-btn {

  border: 1px solid #44aaff;
  border-radius: 10px;

  color: #44aaff;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;

  background: rgba(68,170,255,0.1);
  color: #88ccff;
}

/* ── Settings ── */
#settingsBtn {
  position: fixed; top: 12px; right: 14px; z-index: 200;

}
#settingsBtn:hover { background: rgba(255,255,255,0.14); color: #99b; }
#settingsPanel {
  display: none; position: fixed; top: 58px; right: 14px; z-index: 199;
  background: #131328; border: 1px solid #253050; border-radius: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5); padding: 16px 18px; min-width: 175px;
}
#settingsPanel.open { display: block; }
.s-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.s-label { font-size: 0.88rem; font-weight: 600; color: #aab; }
.s-toggle {
  position: relative; width: 44px; height: 24px; border-radius: 12px;
  border: none; cursor: pointer; transition: background 0.2s;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.s-toggle .thumb {

  border-radius: 50%; background: #fff; transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4); pointer-events: none;

<body>
<a href="/" class="back-link">&#8592; All Games</a>

<div id="top-bar">
  <h1>Trace</h1>
  <div id="level-label">Level <span id="lvl-num">1</span></div>
  <div id="hint-text">Draw from S to E — fill every cell</div>
</div>

<div id="canvas-wrap">
  <canvas id="gc"></canvas>
  <p id="load-err">Couldn&rsquo;t load the 3D engine. Reload the page &mdash; if you&rsquo;re offline, open the game once while connected so it can be cached.</p>
</div>

<div id="btn-row">
  <button class="btn" id="undo-btn">Undo</button>
  <button class="btn" id="reset-btn">Reset</button>
</div>

<div id="win-screen">
  <div id="win-box">
    <div class="win-icon">&#10003;</div>
    <h2>Path Complete!</h2>
    <button id="next-btn">Next Level</button>
  </div>
</div>

<script type="module">
import * as THREE from '/vendor/three.module.min.js';

// ── Juice Toolkit (copy-pasted subset, see /templates/juice.js) ─────────────

function juiceBurst(x, y, colors, opts) {
  opts = opts || {};
  var count = opts.count || 14;
  var spread = opts.spread || 70;
  var duration = opts.duration || 500;
  for (var i = 0; i < count; i++) {
    var el = document.createElement('div');
    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    var dist = spread * (0.5 + Math.random() * 0.5);
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist;
    var size = 4 + Math.random() * 4;
    el.style.cssText =
      'position:fixed;left:' + x + 'px;top:' + y + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
      'background:' + colors[i % colors.length] + ';' +
      'pointer-events:none;z-index:999;';
    document.body.appendChild(el);
    (function(particle, tx, ty) {
      particle.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(0.3)', opacity: 0 }
      ], { duration: duration, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = function() {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      };
    }(el, dx, dy));
  }
}

// ── Board constants (world units, 1 unit = 1 cell) ───────────────────────────

const GAP = 0.09;
const STEP = 1 + GAP;
const PAD = 0.3;
const SLAB_H = 0.42;
const TILE_H = 0.16;
const TILE_LIFT = 0.14;            // how far a visited tile rises
const PATH_Y = TILE_H + TILE_LIFT + 0.10;
const TUBE_R = 0.17;
const CHAMFER = 0.34;              // corner cut, keeps the spline inside its cells
const LABEL_SCALE = 0.58;
const LABEL_Y = TILE_H + TILE_LIFT + 0.66;
const PITCH = THREE.MathUtils.degToRad(51);
const TARGET = new THREE.Vector3(0, 0.3, 0);

// Board neutrals are deliberately light: at ~3:1+ against the near-black page
// they stay readable on a dimmed tablet outdoors (see CLAUDE.md). Lighting
// lands a fully lit top face at roughly the material's own colour.
const C_EMPTY   = new THREE.Color(0x7d7dae);
const C_VISITED = new THREE.Color(0xa5a5e0);
const C_START   = new THREE.Color(0x74d3aa);
const C_END     = new THREE.Color(0xe2bd8d);
const C_WHITE   = new THREE.Color(0xffffff);
const SLAB_COLOR = 0x676796;
const CLR_PATH = 0x8adfff;
const CLR_S = 0x5dffb0;
const CLR_E = 0xffcb8c;

// ── Renderer / scene ─────────────────────────────────────────────────────────

const canvas = document.getElementById('gc');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 1, 200);
const camBase = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0x93a8dd, 0x0e1018, 0.38));

const keyLight = new THREE.DirectionalLight(0xfff4e2, 0.72);
keyLight.position.set(-6.5, 15, 4.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -6.5;
keyLight.shadow.camera.right = 6.5;
keyLight.shadow.camera.top = 6.5;
keyLight.shadow.camera.bottom = -6.5;
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 34;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.16);
fillLight.position.set(7, 5, -8);
scene.add(fillLight);

// ── Geometry helpers ─────────────────────────────────────────────────────────

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Beveled box with its base at y=0. ExtrudeGeometry spans [-bevel, depth+bevel]
// on its extrusion axis, so inset the profile by `bevel` and lift by `bevel`.
function roundedBox(w, d, h, r, bevel) {
  const geo = new THREE.ExtrudeGeometry(
    roundedRect(w - 2 * bevel, d - 2 * bevel, Math.max(0.01, r - bevel)),
    {
      depth: h - 2 * bevel,
      bevelEnabled: true,
      bevelThickness: bevel,
      bevelSize: bevel,
      bevelSegments: 2,
      curveSegments: 5
    }
  );
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, bevel, 0);
  return geo;
}

// Letter drawn with the browser's own fonts — this is a canvas texture, not the
// font-less server-side icon renderer, so a system font stack is fine here.
function labelTexture(ch) {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.font = 'bold 82px -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineWidth = 12;
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(6,6,20,0.92)';
  g.strokeText(ch, s / 2, s / 2 + 4);
  g.fillStyle = '#ffffff';
  g.fillText(ch, s / 2, s / 2 + 4);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const TILE_GEO = roundedBox(1, 1, TILE_H, 0.2, 0.035);
const RING_GEO = new THREE.TorusGeometry(0.40, 0.045, 8, 32).rotateX(-Math.PI / 2);
const HEAD_GEO = new THREE.TorusGeometry(0.30, 0.035, 8, 28).rotateX(-Math.PI / 2);

const slabMat = new THREE.MeshStandardMaterial({ color: SLAB_COLOR, roughness: 0.9, metalness: 0.02 });
const tileMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.02 });
const tubeMat = new THREE.MeshStandardMaterial({
  color: CLR_PATH, roughness: 0.25, metalness: 0.1, emissive: CLR_PATH, emissiveIntensity: 0.55
});

function markerRing(color) {
  const m = new THREE.Mesh(RING_GEO, new THREE.MeshStandardMaterial({
    color, roughness: 0.3, metalness: 0.1, emissive: color, emissiveIntensity: 0.5
  }));
  m.castShadow = true;
  scene.add(m);
  return m;
}

function markerLabel(ch, color) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: labelTexture(ch), color, transparent: true, depthWrite: false
  }));
  s.scale.setScalar(LABEL_SCALE);
  scene.add(s);
  return s;
}

const ringS = markerRing(CLR_S);
const ringE = markerRing(CLR_E);
const labelS = markerLabel('S', CLR_S);
const labelE = markerLabel('E', CLR_E);

const headRing = new THREE.Mesh(HEAD_GEO, new THREE.MeshStandardMaterial({
  color: CLR_PATH, emissive: CLR_PATH, emissiveIntensity: 0.8, transparent: true, roughness: 0.3
}));
scene.add(headRing);

// ── State ────────────────────────────────────────────────────────────────────

const SIZES = [
  {R:3,C:3},{R:3,C:3},{R:3,C:3},
  {R:3,C:4},{R:3,C:4},{R:3,C:4},
  {R:4,C:4},{R:4,C:4},{R:4,C:4},{R:4,C:4},
  {R:4,C:5},{R:4,C:5},{R:4,C:5},{R:4,C:5},
  {R:5,C:5},{R:5,C:5},{R:5,C:5},{R:5,C:5},
  {R:5,C:6},{R:5,C:6},{R:5,C:6},{R:5,C:6},
  {R:6,C:6},{R:6,C:6},{R:6,C:6},
];

let lv = { R: 0, C: 0, start: [0, 0], end: [0, 0] };
let path = [];      // [[r,c], ...]
let vis = [];       // vis[r][c] = true if in path
let drag = false;
let won = false;
let winT = 0;
let winBurst = false;
let lvIdx = 0;

let slab = null;
let tiles = null;
let tube = null;
let cellColor = [];   // per-instance animated colour
let cellLift = [];    // per-instance animated height
let cellFlash = [];   // per-instance win-wave brightness

function cellX(c) { return (c - (lv.C - 1) / 2) * STEP; }
function cellZ(r) { return (r - (lv.R - 1) / 2) * STEP; }
function idxOf(r, c) { return r * lv.C + c; }

// ── Hamiltonian path generator (Warnsdorff + backtrack) ──────────────────────

const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

function genLevel(R, C) {
  const grid = Array.from({length: R}, () => Array(C).fill(false));
  const r0 = Math.floor(Math.random() * R);
  const c0 = Math.floor(Math.random() * C);
  grid[r0][c0] = true;
  const p = [[r0, c0]];
  if (hamilDFS(grid, R, C, p)) {
    return {R, C, start: p[0].slice(), end: p[p.length-1].slice()};
  }
  // Fallback: guaranteed snake path
  const snake = [];
  for (let r = 0; r < R; r++) {
    if (r % 2 === 0) { for (let c = 0; c < C; c++) snake.push([r,c]); }
    else             { for (let c = C-1; c >= 0; c--) snake.push([r,c]); }
  }
  return {R, C, start: snake[0], end: snake[snake.length-1]};
}

function hamilDFS(grid, R, C, p) {
  if (p.length === R * C) return true;
  const [r, c] = p[p.length-1];

  // Collect valid neighbors; count their onward moves for Warnsdorff sort
  const nb = [];
  for (const [dr, dc] of DIRS) {
    const nr = r+dr, nc = c+dc;
    if (nr < 0 || nr >= R || nc < 0 || nc >= C || grid[nr][nc]) continue;
    let fwd = 0;
    for (const [dr2, dc2] of DIRS) {
      const nr2 = nr+dr2, nc2 = nc+dc2;
      if (nr2 >= 0 && nr2 < R && nc2 >= 0 && nc2 < C && !grid[nr2][nc2]) fwd++;
    }
    nb.push({nr, nc, fwd});
  }
  // Fewest onward moves first (Warnsdorff) with random tiebreak for variety
  nb.sort((a,b) => a.fwd - b.fwd || (Math.random() < 0.5 ? -1 : 1));

  for (const {nr, nc} of nb) {
    grid[nr][nc] = true;
    p.push([nr, nc]);
    if (hamilDFS(grid, R, C, p)) return true;
    p.pop();
    grid[nr][nc] = false;
  }
  return false;
}

// ── Board build ──────────────────────────────────────────────────────────────

function buildBoard() {
  if (slab) { slab.geometry.dispose(); scene.remove(slab); }
  if (tiles) { tiles.dispose(); scene.remove(tiles); }

  const bw = lv.C + (lv.C - 1) * GAP + 2 * PAD;
  const bd = lv.R + (lv.R - 1) * GAP + 2 * PAD;
  slab = new THREE.Mesh(roundedBox(bw, bd, SLAB_H, 0.34, 0.06), slabMat);
  slab.position.y = -SLAB_H;
  slab.receiveShadow = true;
  scene.add(slab);

  const n = lv.R * lv.C;
  tiles = new THREE.InstancedMesh(TILE_GEO, tileMat, n);
  tiles.castShadow = true;
  tiles.receiveShadow = true;
  scene.add(tiles);

  cellColor = [];
  cellLift = new Float32Array(n);
  cellFlash = new Float32Array(n);
  for (let i = 0; i < n; i++) cellColor.push(new THREE.Color());
  syncCells(true);
}

const _obj = new THREE.Object3D();
const _col = new THREE.Color();

function targetColor(r, c, out) {
  if (r === lv.start[0] && c === lv.start[1]) return out.copy(C_START);
  if (r === lv.end[0] && c === lv.end[1]) return out.copy(C_END);
  return out.copy(vis[r][c] ? C_VISITED : C_EMPTY);
}

// Writes per-instance colour + height. `snap` skips the easing on a fresh level.
function syncCells(snap, dt) {
  const k = snap ? 1 : 1 - Math.pow(0.001, dt);
  for (let r = 0; r < lv.R; r++) {
    for (let c = 0; c < lv.C; c++) {
      const i = idxOf(r, c);
      targetColor(r, c, _col);
      if (cellFlash[i] > 0.001) _col.lerp(C_WHITE, cellFlash[i] * 0.75);
      const lift = (vis[r][c] ? TILE_LIFT : 0) + cellFlash[i] * 0.16;
      cellColor[i].lerp(_col, k);
      cellLift[i] += (lift - cellLift[i]) * k;
      _obj.position.set(cellX(c), cellLift[i], cellZ(r));
      _obj.updateMatrix();
      tiles.setMatrixAt(i, _obj.matrix);
      tiles.setColorAt(i, cellColor[i]);
    }
  }
  tiles.instanceMatrix.needsUpdate = true;
  tiles.instanceColor.needsUpdate = true;
}

// ── Path tube ────────────────────────────────────────────────────────────────

// Straight runs joined by short quarter-arcs. Feeding the spline pre-chamfered
// corners keeps centripetal Catmull-Rom from bulging past the turn (~0.14 of a
// cell without this, ~0.005 with it).
function pathPolyline() {
  const p = path.map(([r, c]) => new THREE.Vector3(cellX(c), PATH_Y, cellZ(r)));
  if (p.length < 3) return p;
  const out = [p[0]];
  const inD = new THREE.Vector3(), outD = new THREE.Vector3();
  for (let i = 1; i < p.length - 1; i++) {
    const a = p[i-1], b = p[i], d = p[i+1];
    inD.subVectors(b, a).normalize();
    outD.subVectors(d, b).normalize();
    if (inD.dot(outD) > 0.999) { out.push(b.clone()); continue; }
    const s = b.clone().addScaledVector(inD, -CHAMFER);
    const e = b.clone().addScaledVector(outD, CHAMFER);
    out.push(s);
    for (let k = 1; k <= 3; k++) {
      const t = k / 4;
      out.push(s.clone().lerp(b, t).lerp(b.clone().lerp(e, t), t));
    }
    out.push(e);
  }
  out.push(p[p.length-1]);
  return out;
}

function rebuildTube() {
  if (tube) { tube.geometry.dispose(); scene.remove(tube); tube = null; }
  if (path.length < 2) return;
  const pts = pathPolyline();
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const geo = new THREE.TubeGeometry(curve, Math.min(600, pts.length * 6), TUBE_R, 10, false);
  tube = new THREE.Mesh(geo, tubeMat);
  tube.castShadow = true;
  scene.add(tube);
}

// ── Level init ───────────────────────────────────────────────────────────────

function startLevel(idx) {
  lvIdx = idx;
  document.getElementById('lvl-num').textContent = idx + 1;
  const sz = SIZES[Math.min(idx, SIZES.length - 1)] || {R: 6, C: 6};
  lv = genLevel(sz.R, sz.C);
  won = false;
  winBurst = false;
  document.getElementById('win-screen').classList.remove('show');
  resetPath();
  buildBoard();
  buildFitPoints();
  layout();
}

function resetPath() {
  path = [lv.start.slice()];
  vis = Array.from({length: lv.R}, () => Array(lv.C).fill(false));
  vis[lv.start[0]][lv.start[1]] = true;
  drag = false;
  if (cellFlash) cellFlash.fill(0);
  rebuildTube();
}

// ── Layout ───────────────────────────────────────────────────────────────────

// Everything that must stay on screen. `pad` is a screen-space allowance, for
// the S/E labels: they're camera-aligned sprites, so they take up a fixed slab
// of screen regardless of where the cell they sit on projects to.
let fitPts = [];

function buildFitPoints() {
  const hw = (lv.C + (lv.C - 1) * GAP + 2 * PAD) / 2;
  const hd = (lv.R + (lv.R - 1) * GAP + 2 * PAD) / 2;
  fitPts = [];
  for (const x of [-hw, hw]) {
    for (const z of [-hd, hd]) {
      for (const y of [-SLAB_H, TILE_H + TILE_LIFT]) {
        fitPts.push({ v: new THREE.Vector3(x, y, z), pad: 0 });
      }
    }
  }
  const lx = (lv.C - 1) / 2 * STEP, lz = (lv.R - 1) / 2 * STEP;
  for (const x of [-lx, lx]) {
    for (const z of [-lz, lz]) {
      fitPts.push({ v: new THREE.Vector3(x, LABEL_Y, z), pad: LABEL_SCALE / 2 });
    }
  }
}

const FIT_MARGIN = 0.97;   // leave a 3% border in normalised device coords
const camTarget = new THREE.Vector3();

// Rough orthographic estimate of the tilted board's screen aspect. Only used as
// a starting point — perspective makes the real numbers bigger.
function orthoAspect() {
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  let hx = 0, hy = 0;
  for (const { v, pad } of fitPts) {
    hx = Math.max(hx, Math.abs(v.x) + pad);
    hy = Math.max(hy, Math.abs((v.y - TARGET.y) * cp - v.z * sp) + pad);
  }
  return { hx, hy, aspect: hx / hy };
}

// An orthographic solve under-reserves, because perspective spreads the near
// edge of a tilted board outward — at this fov it cropped the corner cells by a
// few percent. So measure instead of predicting: project the corners, walk the
// distance until the widest one sits just inside the frame, and slide the
// look-at point along the camera's own up axis to recentre what's left.
function fitCamera(startDist) {
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  const tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const v = new THREE.Vector3();
  let dist = startDist, shift = 0, spanX = 1, spanY = 1;

  for (let i = 0; i < 12; i++) {
    camTarget.set(TARGET.x, TARGET.y + cp * shift, TARGET.z - sp * shift);
    camera.position.set(camTarget.x, camTarget.y + sp * dist, camTarget.z + cp * dist);
    camera.near = Math.max(0.5, dist - 14);
    camera.far = dist + 14;
    camera.lookAt(camTarget);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);

    const padY = 1 / (dist * tanY);          // world unit -> ndc y
    const padX = padY / camera.aspect;
    let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
    for (const p of fitPts) {
      v.copy(p.v).project(camera);
      mnx = Math.min(mnx, v.x - p.pad * padX);
      mxx = Math.max(mxx, v.x + p.pad * padX);
      mny = Math.min(mny, v.y - p.pad * padY);
      mxy = Math.max(mxy, v.y + p.pad * padY);
    }
    spanX = (mxx - mnx) / 2;
    spanY = (mxy - mny) / 2;
    const cy = (mxy + mny) / 2;
    const over = Math.max(spanX, spanY);
    if (Math.abs(over - FIT_MARGIN) < 0.003 && Math.abs(cy) < 0.003) break;
    shift += cy * dist * tanY;
    dist *= over / FIT_MARGIN;
  }

  camBase.copy(camera.position);
  return { dist, spanX, spanY };
}

function layout() {
  const wrap = document.getElementById('canvas-wrap');
  const availW = Math.max(160, wrap.clientWidth - 20);
  const availH = Math.max(140, wrap.clientHeight - 20);
  const est = orthoAspect();
  const tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  let aspect = est.aspect;
  let dist = est.hy / tanY;

  // Second pass retightens the canvas aspect to the spans the first pass measured,
  // so the board fills the canvas instead of leaving a band on one axis.
  for (let pass = 0; pass < 2; pass++) {
    let w = Math.min(availW, 560);
    let h = w / aspect;
    if (h > availH) { h = availH; w = h * aspect; }
    renderer.setSize(w, h);
    camera.aspect = w / h;
    const fit = fitCamera(dist);
    dist = fit.dist;
    aspect = THREE.MathUtils.clamp(aspect * fit.spanX / fit.spanY, 0.5, 3);
  }
}

window.addEventListener('resize', layout);

// ── Shake ────────────────────────────────────────────────────────────────────

let shakeAmt = 0;
const shakeOff = new THREE.Vector3();
function shake(a) { shakeAmt = Math.max(shakeAmt, a); }

function toScreen(v) {
  const p = v.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return {
    x: rect.left + (p.x * 0.5 + 0.5) * rect.width,
    y: rect.top + (-p.y * 0.5 + 0.5) * rect.height
  };
}

// ── Game logic ───────────────────────────────────────────────────────────────

function isAdj(a, b) {
  return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) === 1;
}

function tryExtend(r, c) {
  if (won) return;
  const cur = path[path.length-1];
  const prev = path.length > 1 ? path[path.length-2] : null;
  if (r === cur[0] && c === cur[1]) return;

  // Drag-back undo
  if (prev && r === prev[0] && c === prev[1]) {
    vis[cur[0]][cur[1]] = false;
    path.pop();
    rebuildTube();
    return;
  }
  // Forward extension
  if (isAdj(cur, [r,c]) && !vis[r][c]) {
    path.push([r,c]);
    vis[r][c] = true;
    rebuildTube();
    shake(0.012);
    checkWin();
  }
}

function undoStep() {
  if (won || path.length <= 1) return;
  const last = path.pop();
  vis[last[0]][last[1]] = false;
  rebuildTube();
}

function checkWin() {
  if (path.length !== lv.R * lv.C) return;
  const [er, ec] = path[path.length-1];
  if (er !== lv.end[0] || ec !== lv.end[1]) return;
  won = true;
  winT = performance.now();
  winBurst = false;
  setTimeout(() => document.getElementById('win-screen').classList.add('show'), 950);
}

// ── Input ────────────────────────────────────────────────────────────────────

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const _hit = new THREE.Vector3();
// Pick against the mid-height of a tile: at a 51-degree tilt the parallax from
// a raised tile is well under a tenth of a cell, and rounding absorbs it.
const pickPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(TILE_H + TILE_LIFT * 0.5));

function cellAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.ray.intersectPlane(pickPlane, _hit)) return null;
  const c = Math.round(_hit.x / STEP + (lv.C - 1) / 2);
  const r = Math.round(_hit.z / STEP + (lv.R - 1) / 2);
  if (r < 0 || r >= lv.R || c < 0 || c >= lv.C) return null;
  return [r, c];
}

canvas.addEventListener('pointerdown', (e) => {
  if (won) return;
  e.preventDefault();
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell) return;
  const [r, c] = cell;
  const [hr, hc] = path[path.length-1];
  if (r === hr && c === hc) {
    drag = true;
  } else if (r === lv.start[0] && c === lv.start[1]) {
    resetPath();
    drag = true;
  }
  if (drag) canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (!drag || won) return;
  e.preventDefault();
  const cell = cellAt(e.clientX, e.clientY);
  if (cell) tryExtend(cell[0], cell[1]);
});

function endDrag(e) {
  drag = false;
  if (e && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.getElementById('undo-btn').addEventListener('click', undoStep);
document.getElementById('reset-btn').addEventListener('click', () => { if (!won) resetPath(); });
document.getElementById('next-btn').addEventListener('click', () => startLevel(lvIdx + 1));

// ── Render loop ──────────────────────────────────────────────────────────────

let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  // Win wave: a bright pulse runs along the path in draw order.
  if (won) {
    const head = ((now - winT) / 620) * path.length;
    for (let i = 0; i < path.length; i++) {
      const [r, c] = path[i];
      const f = Math.max(0, 1 - Math.abs(head - i) / 2.5);
      const j = idxOf(r, c);
      if (f > cellFlash[j]) cellFlash[j] = f;
    }
    if (!winBurst && head >= path.length) {
      winBurst = true;
      const e = toScreen(new THREE.Vector3(cellX(lv.end[1]), PATH_Y, cellZ(lv.end[0])));
      juiceBurst(e.x, e.y, ['#8adfff', '#5dffb0', '#ffcb8c'], { count: 26, spread: 110 });
      shake(0.10);
    }
  }
  for (let i = 0; i < cellFlash.length; i++) {
    if (cellFlash[i] > 0) cellFlash[i] = Math.max(0, cellFlash[i] - dt * 1.5);
  }
  syncCells(false, dt);

  // Markers ride the height of the tile they sit on.
  const sLift = cellLift[idxOf(lv.start[0], lv.start[1])];
  const eLift = cellLift[idxOf(lv.end[0], lv.end[1])];
  ringS.position.set(cellX(lv.start[1]), TILE_H + sLift + 0.02, cellZ(lv.start[0]));
  ringE.position.set(cellX(lv.end[1]), TILE_H + eLift + 0.02, cellZ(lv.end[0]));
  labelS.position.set(ringS.position.x, TILE_H + sLift + 0.62 + Math.sin(t * 1.7) * 0.04, ringS.position.z);
  labelE.position.set(ringE.position.x, TILE_H + eLift + 0.62 + Math.sin(t * 1.7 + 1.6) * 0.04, ringE.position.z);

  // Pulsing ring on the path head, hidden once it reaches the end marker.
  const [hr, hc] = path[path.length-1];
  const atEnd = hr === lv.end[0] && hc === lv.end[1];
  headRing.visible = !won && !atEnd;
  if (headRing.visible) {
    const amp = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 0.7);
    headRing.position.set(cellX(hc), PATH_Y + 0.02, cellZ(hr));
    headRing.scale.setScalar(1 + 0.18 * amp);
    headRing.material.opacity = 0.35 + 0.45 * amp;
  }

  if (shakeAmt > 0.0005) {
    shakeOff.set((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt, 0)
      .applyQuaternion(camera.quaternion);
    camera.position.copy(camBase).add(shakeOff);
    shakeAmt *= Math.pow(0.0015, dt);
  } else if (shakeAmt !== 0) {
    shakeAmt = 0;
    camera.position.copy(camBase);
  }

  renderer.render(scene, camera);
}

// ── Boot ─────────────────────────────────────────────────────────────────────

startLevel(0);
requestAnimationFrame(frame);
window.__traceReady = true;
</script>

<script>
// Settings and music stay a classic script: the inline onclick handlers below
// need these functions on `window`, which a module script would not provide.
var _musicOn = localStorage.getItem('trace-music') !== 'false';
var _actx = null, _mActive = false, _mNodes = [], _mTimers = [];

function _getCtx() {
  if (!_actx) {
    try { _actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { _showAudioWarning(); return null; }
  }
  return _actx;
}
function _showAudioWarning() {
  var el = document.getElementById('audioWarning');
  if (el) el.style.display = 'block';
  var btn = document.getElementById('musicToggle');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; btn.style.cursor = 'default'; }
}
function _playTone(freq, dur, vol) {
  if (!_mActive || !_actx) return;
  var osc = _actx.createOscillator(), g = _actx.createGain();
  osc.connect(g); g.connect(_actx.destination);
  osc.type = 'sine'; osc.frequency.value = freq;
  var t = _actx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.start(t); osc.stop(t + dur);
  _mNodes.push(osc);
  osc.onended = function() { var i = _mNodes.indexOf(osc); if (i > -1) _mNodes.splice(i, 1); };
}
function _startDrone() {
  if (!_actx || !_mActive) return;
  var osc = _actx.createOscillator(), g = _actx.createGain();
  var lfo = _actx.createOscillator(), lg = _actx.createGain();
  lfo.frequency.value = 0.22; lg.gain.value = 0.018;
  lfo.connect(lg); lg.connect(g.gain);
  osc.type = 'triangle'; osc.frequency.value = 73.42; // D2 — dark, mysterious
  osc.connect(g); g.connect(_actx.destination);
  g.gain.setValueAtTime(0.07, _actx.currentTime);
  osc.start(); lfo.start();
  _mNodes.push(osc, lfo);
}
// A natural minor fragments
var _SCALE = [110, 123.47, 130.81, 146.83, 164.81, 196.00, 220, 246.94, 261.63];
function _musicLoop() {
  if (!_mActive) return;
  _playTone(_SCALE[Math.floor(Math.random() * _SCALE.length)], 4.0, 0.038);
  var t = setTimeout(_musicLoop, 2200 + Math.floor(Math.random() * 3200));
  _mTimers.push(t);
}
function _startMusic() {
  if (_mActive || !_musicOn) return;
  var ctx = _getCtx();
  if (!ctx) return;
  _mActive = true;
  if (ctx.state === 'suspended') {
    ctx.resume().then(function() { if (_mActive) { _startDrone(); _musicLoop(); } });
  } else {
    _startDrone(); _musicLoop();
  }
}
function _stopMusic() {
  _mActive = false;
  _mTimers.forEach(function(t) { clearTimeout(t); }); _mTimers = [];
  _mNodes.forEach(function(n) { try { n.stop(0); } catch(e) {} }); _mNodes = [];
}
function _updateToggle() {
  var btn = document.getElementById('musicToggle'); if (!btn) return;
  btn.style.background = _musicOn ? '#44aaff' : '#333';
  var th = btn.querySelector('.thumb'); if (th) th.style.left = _musicOn ? '22px' : '2px';
}
var _audioReady = false;
function _onFirstTouch() {
  if (_audioReady) return; _audioReady = true;
  var ctx = _getCtx();
  if (!ctx) return;
  try {
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start(0);
  } catch(e) {}
  ctx.resume().then(function() {
    if (ctx.state !== 'running') { _showAudioWarning(); return; }
    if (_musicOn && !_mActive) _startMusic();
  }).catch(function() { _showAudioWarning(); });
}
document.addEventListener('click', _onFirstTouch, { once: true });
document.addEventListener('touchstart', _onFirstTouch, { once: true });
function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
function toggleMusic() {
  _musicOn = !_musicOn;
  localStorage.setItem('trace-music', _musicOn);
  _musicOn ? _startMusic() : _stopMusic();
  _updateToggle();
}
document.addEventListener('click', function(e) {
  var p = document.getElementById('settingsPanel'), b = document.getElementById('settingsBtn');
  if (p && p.classList.contains('open') && !p.contains(e.target) && !b.contains(e.target))
    p.classList.remove('open');
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
// The board is drawn entirely by the module script above; if the engine fails
// to load the page would otherwise just sit blank.
setTimeout(function() {
  if (!window.__traceReady) {
    document.getElementById('gc').style.display = 'none';
    document.getElementById('load-err').classList.add('on');
  }
}, 6000);
</script>
<button id="settingsBtn" onclick="toggleSettings()" aria-label="Settings">&#9881;</button>
<div id="settingsPanel">
  <div class="s-row">
    <span class="s-label">Music</span>
    <button id="musicToggle" class="s-toggle" onclick="toggleMusic()"><div class="thumb"></div></button>
  </div>
  <div id="audioWarning" style="display:none;margin-top:8px;font-size:0.75rem;color:#999;line-height:1.3;">Music unavailable in this browser.</div>
</div>
<script>_updateToggle(); if (!(window.AudioContext || window.webkitAudioContext)) _showAudioWarning();</script>
