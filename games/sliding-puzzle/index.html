<title>Sliding Puzzle</title>
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #f7f7f3;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  padding: 20px 16px 40px;
}

.landscape-bg {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  width: 100%;
}

.back-link {
  align-self: flex-start;
  color: #888;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  transition: color 0.15s;
}
.back-link:hover {
  color: #4a90e2;
}

.wrapper {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  width: 100%;
  max-width: 420px;
}

.title {
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  font-weight: 800;
  color: #3d3d3d;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255,255,255,0.9);
}

.info-bar {
  display: flex;
  gap: 14px;
  font-size: 0.88rem;
  font-weight: 600;
  color: #5a5a5a;
}

.info-pill {
  background: rgba(255,255,255,0.75);
  padding: 5px 14px;
  border-radius: 20px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.09);
  letter-spacing: 0.03em;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  width: 100%;
  background: #050a20;
  border-radius: 14px;
  padding: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.05);
}

.tile {
  aspect-ratio: 1;
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  background-color: #0a1030;
  background-repeat: no-repeat;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.tile:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 18px rgba(100,180,255,0.32);
}

.tile:active {
  transform: scale(0.96);
}

.tile.empty {
  background-color: rgba(5, 10, 32, 0.6) !important;
  background-image: none !important;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
  cursor: default;
  pointer-events: none;
}

.tile.solved {
  box-shadow: inset 0 0 0 3px #16a34a, 0 3px 12px rgba(22,163,74,0.45);
}

.tile.slide-in {
  animation: slideIn 0.12s ease;
}

@keyframes slideIn {
  from { transform: scale(0.9); opacity: 0.65; }
  to   { transform: scale(1);   opacity: 1; }
}

.btn-restart {
  padding: 10px 38px;
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 3px 12px rgba(74,144,226,0.38);
  transition: transform 0.15s, box-shadow 0.15s;
}

.btn-restart:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(74,144,226,0.48);
}

.btn-restart:active {
  transform: translateY(0);
  box-shadow: 0 2px 6px rgba(74,144,226,0.3);
}

#winOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(247,247,243,0.88);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

#winOverlay.active {
  display: flex;
}

.win-emoji {
  font-size: clamp(3rem, 14vw, 5.5rem);
  animation: bounceIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  line-height: 1;
}

.win-title {
  font-size: clamp(1.9rem, 8vw, 3.2rem);
  font-weight: 800;
  color: #166534;
  animation: popIn 0.45s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
}

.win-sub {
  font-size: clamp(1rem, 3.5vw, 1.25rem);
  color: #555;
  animation: popIn 0.45s 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
}

.win-play-again {
  margin-top: 8px;
  padding: 12px 46px;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #16a34a 0%, #166534 100%);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(22,163,74,0.42);
  transition: transform 0.15s;
  animation: popIn 0.45s 0.34s cubic-bezier(0.34,1.56,0.64,1) both;
}

.win-play-again:hover { transform: translateY(-2px); }

.confetti-piece {
  position: fixed;
  top: -22px;
  pointer-events: none;
  z-index: 300;
  animation-name: confettiFall;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes bounceIn {
  from { opacity: 0; transform: scale(0.3) translateY(-15px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

@keyframes confettiFall {
  0%   { transform: translateY(0) rotateZ(0deg); opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(112vh) rotateZ(var(--confetti-spin, 540deg)); opacity: 0; }
}

/* ── Settings ── */
#settingsBtn {
  position: fixed; top: 12px; right: 14px; z-index: 200;
  background: rgba(255,255,255,0.75); border: none; border-radius: 50%;
  width: 40px; height: 40px; font-size: 19px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #777; box-shadow: 0 1px 6px rgba(0,0,0,0.13);
  transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
#settingsBtn:hover { background: rgba(255,255,255,0.95); color: #444; }
#settingsPanel {
  display: none; position: fixed; top: 58px; right: 14px; z-index: 199;
  background: #fff; border-radius: 14px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18); padding: 16px 18px; min-width: 175px;
}
#settingsPanel.open { display: block; }
.s-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.s-label { font-size: 0.88rem; font-weight: 600; color: #444; }
.s-toggle {
  position: relative; width: 44px; height: 24px; border-radius: 12px;
  border: none; cursor: pointer; transition: background 0.2s;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.s-toggle .thumb {
  position: absolute; top: 2px; width: 20px; height: 20px;
  border-radius: 50%; background: #fff; transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25); pointer-events: none;
}

  } else {
    return (inv + blankFromBottom) % 2 === 0;
  }
}

function shuffle() {
  var arr;
  do {
    arr = [];
    for (var i = 1; i < TOTAL; i++) arr.push(i);
    arr.push(0);
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  } while (!isSolvable(arr) || isSolved(arr));
  return arr;
}

function isSolved(tiles) {
  for (var i = 0; i < TOTAL - 1; i++) {
    if (tiles[i] !== i + 1) return false;
  }
  return tiles[TOTAL - 1] === 0;
}

function getNeighbours(idx) {
  var row = Math.floor(idx / SIZE);
  var col = idx % SIZE;
  var n = [];
  if (row > 0) n.push(idx - SIZE);
  if (row < SIZE - 1) n.push(idx + SIZE);
  if (col > 0) n.push(idx - 1);
  if (col < SIZE - 1) n.push(idx + 1);
  return n;
}

function initGame() {
  st.tiles = shuffle();
  st.blank = st.tiles.indexOf(0);
  st.moves = 0;
  st.won = false;
  document.getElementById('winOverlay').classList.remove('active');
  updateMoves();
  render();
}

function handleTileClick(idx) {
  if (st.won) return;
  var neighbours = getNeighbours(st.blank);
  if (neighbours.indexOf(idx) === -1) return;

  st.tiles[st.blank] = st.tiles[idx];
  st.tiles[idx] = 0;
  st.blank = idx;
  st.moves++;
  updateMoves();
  render();

  if (isSolved(st.tiles)) {
    st.won = true;
    setTimeout(showWin, 380);
  }
}

function render() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  var solved = isSolved(st.tiles);
  for (var i = 0; i < TOTAL; i++) {
    var val = st.tiles[i];
    var el = document.createElement('div');
    if (val === 0) {
      el.className = 'tile empty';
    } else {
      el.className = 'tile' + (solved ? ' solved' : '');
      var pos = val - 1;
      var pRow = Math.floor(pos / SIZE);
      var pCol = pos % SIZE;
      el.style.backgroundImage = "url('" + IMG_URL + "')";
      el.style.backgroundSize = (SIZE * 100) + '% ' + (SIZE * 100) + '%';
      el.style.backgroundPosition = (pCol * 100 / (SIZE - 1)) + '% ' + (pRow * 100 / (SIZE - 1)) + '%';
      (function(idx) {
        el.addEventListener('click', function() { handleTileClick(idx); });
      }(i));
    }
    board.appendChild(el);
  }
}

function updateMoves() {
  document.getElementById('movesDisplay').textContent = 'Moves: ' + st.moves;
}

function showWin() {
  document.getElementById('winSub').textContent = 'Solved in ' + st.moves + ' moves!';
  document.getElementById('winOverlay').classList.add('active');
  spawnConfetti();
}

var CONFETTI_COLORS = [
  '#FF6B6B','#4ECDC4','#FFB800','#A29BFE',
  '#FD79A8','#45B7D1','#6C5CE7','#00B894',
  '#FF9F43','#54A0FF','#5F27CD','#01CBC6'
];

function spawnConfetti() {
  for (var i = 0; i < 110; i++) {
    (function(idx) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'confetti-piece';
        var isCircle = Math.random() > 0.45;
        var w = 7 + Math.random() * 9;
        var h = isCircle ? w : w * (1.3 + Math.random() * 0.8);
        var dur = 2.4 + Math.random() * 2.2;
        var spin = Math.floor(Math.random() * 720 - 360) + 'deg';
        var color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        el.style.left = (Math.random() * 100) + 'vw';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.borderRadius = isCircle ? '50%' : '2px';
        el.style.background = color;
        el.style.setProperty('--confetti-spin', spin);
        el.style.animationDuration = dur + 's';
        el.style.animationDelay = '0s';
        document.body.appendChild(el);
        setTimeout(function() {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, (dur + 0.3) * 1000);
      }, idx * 25);
    }(i));
  }
}

document.getElementById('btnRestart').addEventListener('click', initGame);
document.getElementById('btnPlayAgain').addEventListener('click', initGame);

initGame();

// ── Settings & Music ──────────────────────────────────────────
var _musicOn = localStorage.getItem('sliding-puzzle-music') !== 'false';
var _actx = null, _mActive = false, _mNodes = [], _mTimers = [];

function _getCtx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}
function _playTone(freq, dur, vol) {
  if (!_mActive || !_actx) return;
  var osc = _actx.createOscillator(), g = _actx.createGain();
  osc.connect(g); g.connect(_actx.destination);
  osc.type = 'sine'; osc.frequency.value = freq;
  var t = _actx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.start(t); osc.stop(t + dur);
  _mNodes.push(osc);
  osc.onended = function() { var i = _mNodes.indexOf(osc); if (i > -1) _mNodes.splice(i, 1); };
}
function _startDrone() {
  if (!_actx || !_mActive) return;
  var osc = _actx.createOscillator(), g = _actx.createGain();
  var lfo = _actx.createOscillator(), lg = _actx.createGain();
  lfo.frequency.value = 0.08; lg.gain.value = 0.015;
  lfo.connect(lg); lg.connect(g.gain);
  osc.type = 'sine'; osc.frequency.value = 55;
  osc.connect(g); g.connect(_actx.destination);
  g.gain.setValueAtTime(0.08, _actx.currentTime);
  osc.start(); lfo.start();
  _mNodes.push(osc, lfo);
  var osc2 = _actx.createOscillator(), g2 = _actx.createGain();
  osc2.type = 'sine'; osc2.frequency.value = 110;
  osc2.connect(g2); g2.connect(_actx.destination);
  g2.gain.value = 0.028; osc2.start();
  _mNodes.push(osc2);
}
// Floating space harmonics
var _SP_FREQS = [110, 138.59, 164.81, 220, 246.94, 329.63];
function _musicLoop() {
  if (!_mActive) return;
  _playTone(_SP_FREQS[Math.floor(Math.random() * _SP_FREQS.length)], 4.5, 0.032);
  var t = setTimeout(_musicLoop, 3000 + Math.floor(Math.random() * 4000));
  _mTimers.push(t);
}
function _startMusic() {
  if (_mActive || !_musicOn) return;
  var ctx = _getCtx();
  _mActive = true;
  if (ctx.state === 'suspended') {
    ctx.resume().then(function() { if (_mActive) { _startDrone(); _musicLoop(); } });
  } else {
    _startDrone(); _musicLoop();
  }
}
function _stopMusic() {
  _mActive = false;
  _mTimers.forEach(function(t) { clearTimeout(t); }); _mTimers = [];
  _mNodes.forEach(function(n) { try { n.stop(0); } catch(e) {} }); _mNodes = [];
}
function _updateToggle() {
  var btn = document.getElementById('musicToggle'); if (!btn) return;
  btn.style.background = _musicOn ? '#4a90e2' : '#ccc';
  var th = btn.querySelector('.thumb'); if (th) th.style.left = _musicOn ? '22px' : '2px';
}
var _audioReady = false;
function _onFirstTouch() {
  if (_audioReady) return; _audioReady = true;
  var ctx = _getCtx();
  var buf = ctx.createBuffer(1, 1, 22050);
  var src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start(0);
  ctx.resume().then(function() { if (_musicOn && !_mActive) _startMusic(); });
}
document.addEventListener('click', _onFirstTouch, { once: true });
document.addEventListener('touchstart', _onFirstTouch, { once: true });
function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); }
function toggleMusic() {
  _musicOn = !_musicOn;
  localStorage.setItem('sliding-puzzle-music', _musicOn);
  _musicOn ? _startMusic() : _stopMusic();
  _updateToggle();
}
document.addEventListener('click', function(e) {
  var p = document.getElementById('settingsPanel'), b = document.getElementById('settingsBtn');
  if (p && p.classList.contains('open') && !p.contains(e.target) && !b.contains(e.target))
    p.classList.remove('open');
});
</script>
<button id="settingsBtn" onclick="toggleSettings()" aria-label="Settings">&#9881;</button>
<div id="settingsPanel">
  <div class="s-row">
    <span class="s-label">Music</span>
    <button id="musicToggle" class="s-toggle" onclick="toggleMusic()"><div class="thumb"></div></button>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
_updateToggle();
</script>
