<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/games/vantage/manifest.json">
<title>Vantage</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d0d1a;
  color: #e0e0e0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overflow-x: hidden;
}

.back-link {
  align-self: flex-start;
  color: #888;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 14px 16px 0;
  transition: color 0.15s;
}
.back-link:hover { color: #4a9eff; }

#game-wrap {
  width: 100%;
  max-width: 460px;
  padding: 10px 16px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

#header {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.level-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #9a9ab0;
  text-transform: uppercase;
}

#target-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #8888a0;
}

#target-wrap {
  border-radius: 16px;
  padding: 14px;
  background: #5e5e8a;
  border: 1px solid #8a8ac0;
}

#target-svg { display: block; width: 220px; height: 200px; }

#hint-row {
  font-size: 12px;
  color: #8888a0;
  text-align: center;
  line-height: 1.5;
  max-width: 280px;
}

#candidates-section { width: 100%; }

.cands-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #8888a0;
  text-align: center;
  margin-bottom: 12px;
}

#candidates {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cand-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  border-radius: 14px;
  padding: 10px 6px;
  border: 2px solid #8a8ac0;
  background: #5e5e8a;
  transition: border-color 0.15s, background 0.15s;
  touch-action: manipulation;
}

.cand-btn svg { display: block; width: 100%; height: auto; }

.cand-letter {
  font-size: 13px;
  font-weight: 700;
  color: #8888a0;
  transition: color 0.15s;
}

.cand-btn.correct {
  border-color: #00D48C;
  background: rgba(0,212,140,0.12);
}
.cand-btn.correct .cand-letter { color: #00D48C; }

.cand-btn.wrong {
  border-color: #FF5722;
  background: rgba(255,87,34,0.1);
}
.cand-btn.wrong .cand-letter { color: #FF5722; }

#feedback {
  min-height: 22px;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}

#complete-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 20;
  padding: 20px;
  text-align: center;
}
#complete-overlay.show { display: flex; }
#complete-overlay .co-title {
  font-size: 34px;
  font-weight: 800;
  color: #00D48C;
  text-shadow: 0 0 24px rgba(0,212,140,0.6);
}
#complete-overlay .co-sub { font-size: 14px; color: #9a9ab0; max-width: 300px; }
#complete-overlay button {
  background: linear-gradient(135deg, #4a9eff, #0066cc);
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 16px 48px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  touch-action: manipulation;
}
#complete-overlay button:active { transform: scale(0.97); }

.confetti-p {
  position: fixed;
  top: -20px;
  pointer-events: none;
  z-index: 200;
  animation: cfall linear forwards;
}
@keyframes cfall {
  to { transform: translateY(110vh) rotate(var(--spin)); opacity: 0; }
}
</style>
</head>
<body>

<a href="/" class="back-link">&larr; All Games</a>

<div id="game-wrap">
  <div id="header">
    <span class="level-label">Level <span id="level-num">1</span> / <span id="level-total">5</span></span>
  </div>

  <div id="target-section">
    <span class="section-label">The pyramid</span>
    <div id="target-wrap">
      <svg id="target-svg" viewBox="0 0 220 200"></svg>
    </div>
    <div id="hint-row">Seen from directly above, which of these matches?</div>
  </div>

  <div id="candidates-section">
    <div class="cands-label">Top-down view</div>
    <div id="candidates"></div>
  </div>

  <div id="feedback"></div>
</div>

<div id="complete-overlay">
  <div class="co-title">Complete! &#127881;</div>
  <div class="co-sub">You matched all 5 pyramids correctly.</div>
  <button onclick="startGame()">Play Again</button>
</div>

<script>
'use strict';

// ── Juice Toolkit (copy-pasted subset, see /templates/juice.js) ─────────────

function juiceSquash(el, opts) {
  opts = opts || {};
  var sx = opts.sx != null ? opts.sx : 1.25;
  var sy = opts.sy != null ? opts.sy : 0.8;
  var duration = opts.duration || 220;
  var base = opts.base ? opts.base + ' ' : '';
  el.animate([
    { transform: base + 'scale(1,1)' },
    { transform: base + 'scale(' + sx + ',' + sy + ')', offset: 0.35 },
    { transform: base + 'scale(' + (2 - sx) + ',' + (2 - sy) + ')', offset: 0.6 },
    { transform: base + 'scale(1,1)' }
  ], { duration: duration, easing: 'ease-out' });
}

function juiceShake(el, opts) {
  opts = opts || {};
  var mag = opts.magnitude || 6;
  var duration = opts.duration || 300;
  el.animate([
    { transform: 'translateX(0)' },
    { transform: 'translateX(-' + mag + 'px)' },
    { transform: 'translateX(' + mag + 'px)' },
    { transform: 'translateX(-' + (mag * 0.7) + 'px)' },
    { transform: 'translateX(' + (mag * 0.5) + 'px)' },
    { transform: 'translateX(0)' }
  ], { duration: duration, easing: 'ease-in-out' });
}

function juiceBurst(x, y, colors, opts) {
  opts = opts || {};
  var count = opts.count || 14;
  var spread = opts.spread || 70;
  var duration = opts.duration || 500;
  for (var i = 0; i < count; i++) {
    var el = document.createElement('div');
    var angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    var dist = spread * (0.5 + Math.random() * 0.5);
    var dx = Math.cos(angle) * dist;
    var dy = Math.sin(angle) * dist;
    var size = 4 + Math.random() * 4;
    el.style.cssText =
      'position:fixed;left:' + x + 'px;top:' + y + 'px;' +
      'width:' + size + 'px;height:' + size + 'px;border-radius:50%;' +
      'background:' + colors[i % colors.length] + ';' +
      'pointer-events:none;z-index:999;';
    document.body.appendChild(el);
    (function(particle, tx, ty) {
      particle.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(0.3)', opacity: 0 }
      ], { duration: duration, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = function() {
        if (particle.parentNode) particle.parentNode.removeChild(particle);
      };
    }(el, dx, dy));
  }
}

// ── Colorblind-safe, high-contrast palette (Okabe-Ito inspired) ────────────
// A pyramid has 4 faces: North (top), East (right), South (bottom), West (left)
// in the top-down view. The 3D view always looks at the pyramid from the same
// corner, so it always shows exactly the West (screen-left) and South
// (screen-right) faces.

const C = {
  white:  '#F5F5F5',
  green:  '#00D48C',
  blue:   '#1E88E5',
  red:    '#FF5722',
  orange: '#FF9F00',
  yellow: '#FFE040',
  purple: '#E040FB',
  cyan:   '#4FC3F7'
};

// Each level's `solution` gives the full N/E/S/W color assignment; the 3D
// view only ever renders W and S. `decoys` are two hand-crafted wrong
// alternatives. Positions of [solution, ...decoys] are shuffled at render
// time — that's the only randomness in the game.
const LEVELS = [
  {
    solution: { top: C.blue,   right: C.red,    bottom: C.green,  left: C.white },
    decoys: [
      { top: C.white,  right: C.blue,   bottom: C.white,  left: C.blue },
      { top: C.red,    right: C.blue,   bottom: C.green,  left: C.red }
    ]
  },
  {
    solution: { top: C.yellow, right: C.green,  bottom: C.cyan,   left: C.orange },
    decoys: [
      { top: C.orange, right: C.yellow, bottom: C.green,  left: C.cyan },
      { top: C.yellow, right: C.green,  bottom: C.orange, left: C.cyan }
    ]
  },
  {
    solution: { top: C.purple, right: C.white,  bottom: C.red,    left: C.blue },
    decoys: [
      { top: C.blue,   right: C.purple, bottom: C.white,  left: C.red },
      { top: C.purple, right: C.white,  bottom: C.red,    left: C.green }
    ]
  },
  {
    solution: { top: C.cyan,   right: C.orange, bottom: C.yellow, left: C.green },
    decoys: [
      { top: C.green,  right: C.cyan,   bottom: C.orange, left: C.yellow },
      { top: C.yellow, right: C.orange, bottom: C.cyan,   left: C.green }
    ]
  },
  {
    solution: { top: C.cyan,   right: C.red,    bottom: C.orange, left: C.purple },
    decoys: [
      { top: C.purple, right: C.cyan,   bottom: C.red,    left: C.orange },
      { top: C.orange, right: C.red,    bottom: C.cyan,   left: C.purple }
    ]
  }
];

// ── Rendering ────────────────────────────────────────────────────────────────

function pyramidSVG(faces) {
  // Apex at top; West face on screen-left, South face on screen-right.
  return (
    '<polygon points="110,15 25,175 110,175" fill="' + faces.left + '"/>' +
    '<polygon points="110,15 110,175 195,175" fill="' + faces.bottom + '"/>' +
    '<ellipse cx="110" cy="180" rx="88" ry="10" fill="rgba(0,0,0,0.35)"/>' +
    '<polygon points="110,15 25,175 110,175" fill="none" stroke="#0d0d1a" stroke-width="3" stroke-linejoin="round"/>' +
    '<polygon points="110,15 110,175 195,175" fill="none" stroke="#0d0d1a" stroke-width="3" stroke-linejoin="round"/>' +
    '<line x1="110" y1="15" x2="110" y2="175" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>'
  );
}

function topDownSVG(faces) {
  return (
    '<polygon points="5,5 95,5 50,50" fill="' + faces.top + '"/>' +
    '<polygon points="95,5 95,95 50,50" fill="' + faces.right + '"/>' +
    '<polygon points="95,95 5,95 50,50" fill="' + faces.bottom + '"/>' +
    '<polygon points="5,95 5,5 50,50" fill="' + faces.left + '"/>' +
    '<rect x="5" y="5" width="90" height="90" fill="none" stroke="#0d0d1a" stroke-width="3"/>' +
    '<line x1="5" y1="5" x2="95" y2="95" stroke="#0d0d1a" stroke-width="3"/>' +
    '<line x1="95" y1="5" x2="5" y2="95" stroke="#0d0d1a" stroke-width="3"/>'
  );
}

// ── Game state ──────────────────────────────────────────────────────────────

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let level = 1, puzzle = null, locked = false;
const LEVEL_COUNT = LEVELS.length;

function startGame() {
  level = 1;
  document.getElementById('complete-overlay').classList.remove('show');
  document.getElementById('level-total').textContent = LEVEL_COUNT;
  nextPuzzle();
}

function nextPuzzle() {
  const data = LEVELS[level - 1];
  const alts = shuffle([
    { faces: data.solution, correct: true },
    { faces: data.decoys[0], correct: false },
    { faces: data.decoys[1], correct: false }
  ]);
  puzzle = { solution: data.solution, alts, correctIdx: alts.findIndex(a => a.correct) };
  locked = false;
  document.getElementById('level-num').textContent = level;
  renderPuzzle();
  setFeedback('', '');
}

function renderPuzzle() {
  document.getElementById('target-svg').innerHTML = pyramidSVG(puzzle.solution);

  const container = document.getElementById('candidates');
  container.innerHTML = '';

  puzzle.alts.forEach((alt, i) => {
    const btn = document.createElement('div');
    btn.className = 'cand-btn';

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.innerHTML = topDownSVG(alt.faces);

    const lbl = document.createElement('div');
    lbl.className = 'cand-letter';
    lbl.textContent = String.fromCharCode(65 + i);

    btn.appendChild(svg);
    btn.appendChild(lbl);
    btn.addEventListener('click', () => pick(i, btn));
    container.appendChild(btn);
  });
}

function setFeedback(msg, color) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.style.color = color;
}

function pick(idx, btn) {
  if (locked) return;

  if (idx === puzzle.correctIdx) {
    locked = true;
    btn.classList.add('correct');
    setFeedback('Correct! ✓', '#00D48C');
    juiceSquash(btn);
    const rect = btn.getBoundingClientRect();
    juiceBurst(rect.left + rect.width / 2, rect.top + rect.height / 2,
      [puzzle.solution.top, puzzle.solution.right, puzzle.solution.bottom, puzzle.solution.left]);

    setTimeout(() => {
      if (level >= LEVEL_COUNT) {
        showComplete();
      } else {
        level++;
        nextPuzzle();
      }
    }, 900);
  } else {
    btn.classList.add('wrong');
    juiceShake(btn);
    setFeedback('Not quite — try again', '#FF5722');
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

function showComplete() {
  document.getElementById('complete-overlay').classList.add('show');
  spawnConfetti();
}

// ── Confetti ─────────────────────────────────────────────────────────────────

const CC = [C.orange, C.cyan, C.green, C.yellow, C.blue, C.red, C.purple, C.white];

function spawnConfetti() {
  for (let i = 0; i < 65; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-p';
      const w = 5 + Math.random() * 9;
      const h = Math.random() < 0.5 ? w : w * (1.3 + Math.random() * 0.9);
      const dur = 1.5 + Math.random() * 1.8;
      el.style.cssText =
        `left:${Math.random()*100}vw;` +
        `width:${w}px;height:${h}px;` +
        `border-radius:${Math.random()<0.5?'50%':'2px'};` +
        `background:${CC[Math.floor(Math.random()*CC.length)]};` +
        `--spin:${Math.random()*760-380}deg;` +
        `animation-duration:${dur}s;`;
      document.body.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, (dur+0.4)*1000);
    }, i * 16);
  }
}

// ── PWA ────────────────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

// ── Boot ─────────────────────────────────────────────────────────────────────

startGame();
</script>
</body>
</html>
