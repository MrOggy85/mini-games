<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Mini Games</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(ellipse at top, #fff5e6 0%, #fff8f0 60%, #ffecd8 100%);
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  color: #2d1a00;
}
.container {
  text-align: center;
  padding: 2.5rem 1.5rem 3rem;
  max-width: 780px;
  margin: 0 auto;
}
h1 {
  font-size: 3rem;
  font-weight: 900;
  color: #ff6b35;
  letter-spacing: -1px;
  margin-bottom: 0.4rem;
}
.subtitle {
  font-size: 1.05rem;
  color: #c07840;
  font-weight: 500;
  margin-bottom: 2.5rem;
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1.2rem;
}
.games a {
  display: flex;
  flex-direction: column;
  border-radius: 20px;
  background: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.09);
  text-decoration: none;
  overflow: hidden;
  color: #2d1a00;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.games a:hover {
  transform: translateY(-5px) scale(1.03);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}
.games a:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.card-art {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14%;
}
.card-art svg {
  width: 100%;
  height: 100%;
}
.card-name {
  padding: 0.6rem 0.5rem 0.8rem;
  font-size: 0.92rem;
  font-weight: 800;
  text-align: center;
  letter-spacing: 0.01em;
}
</style>
</head>
<body>
<div class="container">
  <h1>Mini Games</h1>
  <p class="subtitle">Tap a game to play!</p>
  <div class="games">

          <line x1="25.5" y1="64" x2="28" y2="64" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>
          <line x1="11.8" y1="56.8" x2="13.6" y2="58.6" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>

          <line x1="68.5" y1="64" x2="71" y2="64" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>
          <line x1="54.8" y1="56.8" x2="56.6" y2="58.6" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>
          <line x1="66.4" y1="69.4" x2="68.2" y2="71.2" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>
          <line x1="68.2" y1="56.8" x2="66.4" y2="58.6" stroke="#ffd93d" stroke-width="2" stroke-linecap="round"/>

        </svg>

    <a href="/games/trace/">
