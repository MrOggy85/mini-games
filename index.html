<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>Mini Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    color: #ccc;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 3rem;
    color: #4af;
    text-shadow:
      0 0 10px #4af,
      0 0 20px #4af,
      0 0 40px #06f;
    margin-bottom: 3rem;
  }
  .games {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
  }
  .games a {
    display: block;
    padding: 1.5rem 3rem;
    border: 1px solid #333;
    border-radius: 8px;
    color: #4af;
    text-decoration: none;
    font-size: 1.4rem;
    transition: all 0.2s;
  }
  .games a:hover {
    border-color: #4af;
    background: rgba(68, 170, 255, 0.08);
    text-shadow: 0 0 8px #4af;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Mini Games</h1>
  <div class="games">
    <a href="/games/memory/">Memory</a>
    <a href="/games/sliding-puzzle/">Sliding Puzzle</a>
    <a href="/games/sudoku/">Sudoku</a>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
